<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Comprobación de PI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: un atlas de laboratorio. Cada sistema tiene el color de su propio mundo:
   rojo arterial y azul venoso para la circulación, ámbar para la orina, verde para
   la alimentación. Los esquemas son láminas con alfileres numerados para rotular. */
:root{
  --bg:#eef3f1; --paper:#ffffff; --paper-2:#f5f8f7; --ink:#13263b; --ink-2:#56677a; --line:#d2dce1;
  --art:#d62f45; --art-l:#fbd9dd; --ven:#2d63c8; --ven-l:#d8e4fa; --muscle:#b8455a;
  --uri:#d99a0b; --uri-l:#fdecc2; --nut:#2c9a57; --nut-l:#d6f0df;
  --ok:#22803a; --ok-bg:#e3f5e7; --bad:#c2410c; --bad-bg:#fff0e5; --sel:#ffd84d;
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{font-family:var(--f-body);color:var(--ink);background:var(--bg);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;min-height:100vh}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:6px 56px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);line-height:1.08;text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}
.c-circ{--sys:var(--art);--sys-l:var(--art-l)}
.c-excr{--sys:var(--uri);--sys-l:var(--uri-l)}
.c-nut{--sys:var(--nut);--sys-l:var(--nut-l)}

/* top */
.top{display:flex;align-items:center;gap:10px;padding-block:12px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:1.12rem;padding:4px}
.brand .mark{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem}
.top .sp{flex:1}
.hub{color:var(--ink-2);font-weight:700;font-size:.92rem;text-decoration:none}
.hub:hover{color:var(--ink);text-decoration:underline}
.iconbtn{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;width:42px;height:42px;cursor:pointer;font-size:1.05rem}

/* hero */
.hero{padding-block:8px 4px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:clamp(2.3rem,8vw,3.8rem);font-weight:800;letter-spacing:-.02em}
.hero .lead{margin:0;color:var(--ink-2);max-width:52ch}
.ecg{width:100%;height:54px;display:block}
.ecg path{fill:none;stroke:var(--art);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1400;stroke-dashoffset:0;animation:beat 2.6s ease-out 1}
@keyframes beat{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
.when{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.date{display:inline-flex;gap:10px;align-items:baseline;background:var(--ink);color:var(--paper);border-radius:12px;padding:8px 14px}
.date b{font-family:var(--f-display);font-size:1.15rem}
.left{font-weight:700;color:var(--art)}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none;counter-reset:f}
@media (max-width:620px){.flow{grid-template-columns:1fr}}
.flow li{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;position:relative}
.flow li .mono{color:var(--sys)}
.flow li b{font-family:var(--f-display);font-size:1.08rem}
.flow li span.t{color:var(--ink-2);font-size:.92rem}
.flow li::after{content:"→";position:absolute;right:-10px;top:50%;transform:translateY(-50%);background:var(--bg);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:.85rem;color:var(--ink-2);z-index:1}
.flow li:last-child::after{display:none}
@media (max-width:620px){.flow li::after{right:auto;left:50%;top:auto;bottom:-14px;transform:translateX(-50%) rotate(90deg)}}

/* sections / cards */
.sec{margin-top:34px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sec-head .vessel{flex:0 0 34px;height:10px;border-radius:99px;background:var(--sys)}
.sec-head h2{font-size:1.45rem}
.sec-head .mono{color:var(--ink-2);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.grid{grid-template-columns:1fr}}
.card{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:16px 16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);border-color:var(--sys);box-shadow:0 8px 20px -14px var(--sys)}
.card .mono{color:var(--sys)}
.card .ct{font-family:var(--f-display);font-weight:800;font-size:1.15rem;line-height:1.15}
.card .sub{color:var(--ink-2);font-size:.92rem}
.card .meta{margin-top:auto;padding-top:6px}
.stars{color:#e3a008;font-size:1.05rem;letter-spacing:2px}
.stars .off{color:var(--line)}
.stars.none{font-size:.82rem;letter-spacing:0;color:var(--ink-2)}
.big-actions{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:22px}
@media (max-width:560px){.big-actions{grid-template-columns:1fr}}
.exam{display:flex;align-items:center;gap:14px;text-align:left;background:var(--ink);color:var(--paper);border:0;border-radius:18px;padding:18px 20px;cursor:pointer}
.exam:hover{background:#1d3654}
.exam .t{display:block;font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.exam .s{display:block;font-size:.9rem;opacity:.85}
.exam > span:first-child{flex:1;min-width:0}
.exam .stars .off{color:#4b5d72}
.exam .stars.none{color:#b9c5d3}
.exam.alt{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.exam.alt:hover{border-color:var(--ink);background:var(--paper)}
.videos{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.videos a{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;color:var(--ink);text-decoration:none;font-weight:700;font-size:.92rem}
.videos a:hover{border-color:var(--ink)}
.videos a::before{content:"▶";font-size:.7rem;color:var(--art)}

/* lesson */
.lesson-head{display:flex;flex-direction:column;gap:6px;margin:6px 0 16px}
.lesson-head .mono{color:var(--sys)}
.lesson-head h1{font-size:clamp(1.8rem,6vw,2.5rem)}
.sheet{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.sheet h3{font-size:1.2rem;margin-top:6px}
.sheet p,.sheet ul{margin:0;max-width:66ch}
.sheet ul{padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
.tip{background:var(--sys-l,var(--paper-2));border-radius:12px;padding:11px 14px;font-size:.98rem}
.figure{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:center;background:var(--paper-2);border-radius:14px;padding:12px}
@media (max-width:600px){.figure{grid-template-columns:1fr}}
.legend-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:.95rem}
.legend-list li{display:flex;gap:8px;align-items:center}
.legend-list .n{flex:0 0 24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem}
.blood-key{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-2)}
.blood-key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:1rem}
.btn:hover{background:#1d3654}
.btn.ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* diagrams */
.dg{width:100%;height:auto;max-height:380px;display:block}
.dg .outline{fill:none;stroke:var(--ink);stroke-width:3}
.dg .wall{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.dg .valve{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.dg .f-ven{fill:var(--ven-l)} .dg .f-art{fill:var(--art-l)} .dg .f-muscle{fill:var(--muscle)}
.dg .v-o{fill:none;stroke:var(--ink);stroke-width:21;stroke-linecap:round;stroke-linejoin:round}
.dg .v-ven,.dg .v-art,.dg .v-uri{fill:none;stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
.dg .v-ven{stroke:var(--ven)} .dg .v-art{stroke:var(--art)} .dg .v-uri{stroke:var(--uri)}
.dg .thin .v-o{stroke-width:13} .dg .thin .v-ven,.dg .thin .v-art,.dg .thin .v-uri{stroke-width:8}
.dg .arrow{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.dg .organ{stroke:var(--ink);stroke-width:2.5}
.dg .lung{fill:#f6d3d8;stroke:var(--ink);stroke-width:2.5}
.dg .net{fill:none;stroke:#8a5cc2;stroke-width:1.6;opacity:.85}
.dg .kid{fill:#c44a5c;stroke:var(--ink);stroke-width:2.5}
.dg .blad{fill:var(--uri-l);stroke:var(--ink);stroke-width:2.5}
.dg .skin1{fill:#f7c6b7} .dg .skin2{fill:#f3a9a0} .dg .skin3{fill:#fbe39a} .dg .fat{fill:#f6d36b;stroke:#d9ab2c;stroke-width:1.2}
.dg .hair{fill:none;stroke:#3b2a22;stroke-width:3.4;stroke-linecap:round}
.dg .foll{fill:#6b4635}
.dg .gland{fill:none;stroke:var(--uri);stroke-width:3.2;stroke-linecap:round}
.dg .drop{fill:var(--ven)}
.dg .ring{fill:#c9d3d9} .dg .ring-t{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;fill:var(--ink)}
.dg .sector{stroke:#fff;stroke-width:3}
.dg .water{fill:#e6f1fb;stroke:#fff;stroke-width:3}
.dg .s-vf{fill:#7cc58a} .dg .s-leg{fill:#ecc46e} .dg .s-leche{fill:#9ccbeb} .dg .s-carnes{fill:#ea8f8f} .dg .s-aceites{fill:#d8c95c} .dg .s-dulces{fill:#bb98dc}
.dg .pin circle{fill:var(--paper);stroke:var(--ink);stroke-width:2.5}
.dg .pin text{font-family:var(--f-mono);font-size:13px;text-anchor:middle;fill:var(--ink)}
.dg .pin[data-row]{cursor:pointer}
.dg .pin.on circle{fill:var(--sel)}
.dg .pin.right circle{fill:var(--ok-bg);stroke:var(--ok)}
.dg .pin.wrong circle{fill:var(--bad-bg);stroke:var(--bad)}
.dg .clickable{cursor:pointer;transition:opacity .12s}
.dg .clickable:hover{opacity:.8}
.dg .clickable.right{stroke:var(--ok);stroke-width:5}
.dg .clickable.wrong{stroke:var(--bad);stroke-width:5}

/* question */
.qhead{display:flex;align-items:center;gap:12px;font-weight:700;font-size:.92rem}
.qhead .count{margin-left:auto;color:var(--ink-2)}
.qhead .score{color:var(--ok)}
.link{background:none;border:0;cursor:pointer;color:var(--ink-2);font-weight:700;padding:4px 0}
.link:hover{color:var(--ink);text-decoration:underline}
.bar{height:8px;border-radius:99px;margin:10px 0 18px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%;background:var(--sys,var(--ink));border-radius:99px;transition:width .3s}
.qcard{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qtag{margin:0;color:var(--sys,var(--ink-2))}
.prompt{font-family:var(--f-body);font-weight:700;font-size:1.15rem;line-height:1.4;margin:0}
.stmt{font-size:1.25rem;background:var(--paper-2);border-radius:12px;padding:14px 16px;margin:0}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.options.stack{grid-template-columns:1fr}
.opt{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:1.02rem}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.hint{font-size:.88rem;color:var(--ink-2);margin:0}

/* label game */
.lab{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:640px){.lab{grid-template-columns:1fr}}
.lab .dgbox{background:var(--paper-2);border-radius:14px;padding:8px}
.rows{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:10px;text-align:left;background:var(--paper);border:1.5px dashed var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;min-height:46px}
.lrow .n{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem}
.lrow .v{color:var(--ink-2)}
.lrow.filled{border-style:solid;border-color:var(--ink)}
.lrow.filled .v{color:var(--ink);font-weight:700}
.lrow.on{background:#fff7cf;border-color:var(--ink)}
.lrow.right{border-color:var(--ok);background:var(--ok-bg)}
.lrow.wrong{border-color:var(--bad);background:var(--bad-bg)}
.lrow .fix{display:block;font-size:.85rem;color:var(--ok);font-weight:700}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--paper);border:1.5px solid var(--line);border-radius:99px;padding:8px 13px;cursor:pointer;font-size:.98rem;font-weight:700}
.chip:hover:not(:disabled){border-color:var(--ink)}
.chip.on{background:var(--sel);border-color:var(--ink)}
.chip.used{opacity:.3}
.chip:disabled{cursor:default}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mi{position:relative;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px 10px 40px;cursor:pointer;font-size:.98rem;min-height:48px}
.mi:hover:not(:disabled){border-color:var(--ink)}
.mi .b{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem;color:#fff}
.mi.on{background:#fff7cf;border-color:var(--ink)}
.mi.paired .b{border-style:solid}
.mi.right{border-color:var(--ok);background:var(--ok-bg)}
.mi.wrong{border-color:var(--bad);background:var(--bad-bg)}
.mi:disabled{cursor:default}
.mi.lft{font-weight:700}

/* order */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px;min-height:46px}
.slot .n{font-family:var(--f-mono);font-size:.8rem;width:1.6em;color:var(--ink-2)}
.slot.filled{border-style:solid;border-color:var(--ink);background:var(--paper)}

/* cloze */
.cloze{font-size:1.15rem;line-height:2.3;background:var(--paper-2);border-radius:12px;padding:10px 16px;margin:0}
.blank{display:inline-block;min-width:7.5em;border:0;border-bottom:2.5px solid var(--ink);background:transparent;padding:0 6px;cursor:pointer;font-weight:700;line-height:1.5;text-align:center}
.blank.empty{color:var(--ink-2);font-weight:400}
.blank.on{background:#fff7cf}
.blank.right{border-color:var(--ok);background:var(--ok-bg)}
.blank.wrong{border-color:var(--bad);background:var(--bad-bg)}
.blank:disabled{cursor:default}

/* sort */
.sorts{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px}
@media (max-width:560px){.srow{grid-template-columns:1fr}}
.srow .it{font-weight:700}
.srow.right{border-color:var(--ok);background:var(--ok-bg)}
.srow.wrong{border-color:var(--bad);background:var(--bad-bg)}
.srow .fix{display:block;font-weight:400;font-size:.85rem;color:var(--ok)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{background:var(--paper);border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.9rem;font-weight:700}
.cat.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cat:disabled{cursor:default}

/* plate game */
.food{display:flex;align-items:center;gap:14px;background:var(--paper-2);border-radius:14px;padding:12px 16px}
.food .e{font-size:2.6rem;line-height:1}
.food b{font-family:var(--f-display);font-size:1.5rem}
.plate-q{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:600px){.plate-q{grid-template-columns:1fr}}
.groups{display:flex;flex-direction:column;gap:8px}
.grp{display:flex;align-items:center;gap:10px;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;font-weight:700;font-size:.96rem}
.grp:hover:not(:disabled){border-color:var(--ink)}
.grp i{flex:0 0 16px;height:16px;border-radius:4px}
.grp.right{border-color:var(--ok);background:var(--ok-bg)}
.grp.wrong{border-color:var(--bad);background:var(--bad-bg)}
.grp:disabled{cursor:default}

/* feedback / result */
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;border:2px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb .verdict{font-family:var(--f-display);font-weight:800;font-size:1.25rem;margin:0}
.fb.ok .verdict{color:var(--ok)} .fb.bad .verdict{color:var(--bad)}
.fb p,.fb ol{margin:0}
.fb .btn{align-self:flex-start}
.result{text-align:center;align-items:center;padding:26px 18px}
.result .big{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1}
.result .stars{font-size:2rem}
.result p{margin:0;color:var(--ink-2)}
.result .actions{justify-content:center}
.clock{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-weight:800;font-size:1.35rem}
.clock .time{font-variant-numeric:tabular-nums;border-radius:12px;padding:4px 12px;background:var(--ink);color:var(--paper)}
.clock .time.low{background:var(--bad)}
.flash-ok{animation:fok .45s}
.flash-bad{animation:fbad .45s}
@keyframes fok{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes fbad{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
footer{text-align:center;color:var(--ink-2);font-size:.88rem;padding-top:36px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var HUB='../../home.html';

/* ---------- utilidades ---------- */
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a,n){return shuffle(a).slice(0,n);}

  lesson:function(){return '<h3>El sistema circulatorio</h3><p>Está formado por la <b>sangre</b>, los <b>vasos sanguíneos</b> y el <b>corazón</b>. Actúan de manera coordinada para distribuir sustancias por todo el cuerpo.</p>'+

 {id:'sangre',sys:'circ',sysName:'Sistema circulatorio',title:'La sangre y los vasos',sub:'Plasma, glóbulos, plaquetas, arterias, venas y capilares',
  lesson:function(){return '<h3>¿Qué hace la sangre?</h3><p>Viaja por los <b>vasos sanguíneos</b> y transporta los <b>nutrientes</b> de los alimentos, el <b>oxígeno</b> del aire y otras sustancias a todos los órganos, que están formados por <b>células</b>. Las células usan los nutrientes y el oxígeno para obtener energía, crecer y reproducirse. Los <b>desechos</b> que generan los liberan a la sangre.</p>'+

 {id:'excrecion',sys:'excr',sysName:'Sistema excretor',title:'La excreción',sub:'Pulmones, piel y riñones',

 {id:'nutrientes',sys:'nut',sysName:'Alimentación y nutrición',title:'Comida, alimento y nutriente',sub:'Proteínas, hidratos de carbono y lípidos',

    body='<div class="slots" id="slots"></div><div class="options stack" id="pool"></div><div class="actions" style="margin-top:0"><button class="btn" data-act="check" id="chk" disabled>Comprobar</button><button class="btn ghost" data-act="oreset">Empezar de nuevo</button></div>';
  }else if(q.type==='cloze'){
    var ans=[];var html=esc(q.text).replace(/\{([^}]+)\}/g,function(m,a){ans.push(a);return '<button class="blank empty" data-bl="'+(ans.length-1)+'">'+(ans.length)+'</button>';});
    S.ans=ans;S.words=shuffle(ans.concat(q.dist));S.cl=ans.map(function(){return null;});
    body='<p class="cloze">'+html+'</p><div class="bank">'+S.words.map(function(w,i){return '<button class="chip" data-cw="'+i+'">'+esc(w)+'</button>';}).join('')+'</div><div><button class="btn" data-act="check" id="chk" disabled>Comprobar</button></div>';
  }else if(q.type==='sort'){
    body='<div class="sorts">'+q.items.map(function(it,i){return '<div class="srow" data-srow="'+i+'"><span class="it">'+esc(it[0])+'</span><span class="cats">'+q.cats.map(function(c,ci){return '<button class="cat" data-si="'+i+'" data-sc="'+ci+'">'+esc(c)+'</button>';}).join('')+'</span></div>';}).join('')+'</div><div><button class="btn" data-act="check" id="chk" disabled>Comprobar</button></div>';
  }else if(q.type==='plate'){
    var f=q.food;
    body='<div class="food"><span class="e" aria-hidden="true">'+f[0]+'</span><b>'+esc(f[1])+'</b></div><div class="plate-q"><div>'+plateSVG({},true)+'</div><div class="groups">'+
      GROUPS.map(function(g){return '<button class="grp" data-g="'+g.k+'"><i class="sw-'+g.k+'"></i>'+esc(g.n)+'</button>';}).join('')+'</div></div>';
  }
  app.innerHTML=topbar()+'<div class="c-'+(q.sys||'circ')+'">'+
   '<div class="qhead"><button class="link" data-act="home">← Temas</button><span class="count">'+(S.i+1)+' / '+S.qs.length+'</span><span class="score" aria-label="Respuestas correctas">✔ '+S.score+'</span></div>'+
   '<div class="bar"><span style="width:'+(S.i/S.qs.length*100)+'%"></span></div>'+
   '<section class="qcard"><p class="qtag mono">'+esc(q.tag||'Elegí la respuesta')+'</p><h2 class="prompt">'+q.prompt+'</h2>'+body+'<div id="fb" aria-live="polite"></div></section></div>';
  all('.grp i').forEach(function(el){var k=el.className.replace('sw-','');el.style.background=getComputedStyle(document.querySelector('.s-'+k)).fill;});
  if(q.type==='order')drawOrder();
}
function enableCheck(on){var b=document.getElementById('chk');if(b)b.disabled=!on||S.answered;}
/* label */
function drawLabel(){
  var q=S.qs[S.i];
  all('.lrow').forEach(function(el){var r=+el.dataset.row,v=S.lab[r];el.classList.toggle('filled',v!==undefined);el.classList.toggle('on',S.selRow===r);el.querySelector('.v').textContent=v!==undefined?S.bank[v]:'Tocá para ubicar';});
  all('.pin[data-row]').forEach(function(el){el.classList.toggle('on',S.selRow===+el.dataset.row);});
  var used={};Object.keys(S.lab).forEach(function(r){used[S.lab[r]]=1;});
  all('.chip[data-chip]').forEach(function(el){var i=+el.dataset.chip;el.classList.toggle('used',!!used[i]);el.classList.toggle('on',S.selChip===i);});
  enableCheck(Object.keys(S.lab).length===q.keys.length);
}
function placeLabel(row,chip){Object.keys(S.lab).forEach(function(r){if(S.lab[r]===chip)delete S.lab[r];});S.lab[row]=chip;S.selChip=null;S.selRow=null;drawLabel();}
/* match */
function drawMatch(){
  var q=S.qs[S.i],inv={};Object.keys(S.ml).forEach(function(l){inv[S.ml[l]]=+l;});
  var order=Object.keys(S.ml).map(Number).sort();
  function col(l){return PAIR_COLORS[order.indexOf(l)%PAIR_COLORS.length];}
  all('.mi[data-ml]').forEach(function(el){var l=+el.dataset.ml,p=S.ml[l]!==undefined,b=el.querySelector('.b');el.classList.toggle('paired',p);el.classList.toggle('on',S.selL===l);b.style.background=p?col(l):'';b.style.borderColor=p?col(l):'';b.textContent=p?(order.indexOf(l)+1):'';});
  all('.mi[data-mr]').forEach(function(el){var r=+el.dataset.mr,l=inv[r],p=l!==undefined,b=el.querySelector('.b');el.classList.toggle('paired',p);el.classList.toggle('on',S.selR===r);b.style.background=p?col(l):'';b.style.borderColor=p?col(l):'';b.textContent=p?(order.indexOf(l)+1):'';});
  enableCheck(Object.keys(S.ml).length===q.pairs.length);
}
function pairUp(l,r){Object.keys(S.ml).forEach(function(k){if(S.ml[k]===r)delete S.ml[k];});S.ml[l]=r;S.selL=null;S.selR=null;drawMatch();}
/* order */
function drawOrder(){
  var q=S.qs[S.i];
  document.getElementById('slots').innerHTML=q.items.map(function(x,i){var v=S.order[i];return '<div class="slot'+(v!==undefined?' filled':'')+'"><span class="n">'+(i+1)+'.</span><span>'+(v!==undefined?esc(q.items[v]):'')+'</span></div>';}).join('');
  document.getElementById('pool').innerHTML=S.pool.filter(function(i){return S.order.indexOf(i)<0;}).map(function(i){return '<button class="opt" data-oi="'+i+'">'+esc(q.items[i])+'</button>';}).join('');
  enableCheck(S.order.length===q.items.length);
}
/* cloze */
function drawCloze(){
  all('.blank').forEach(function(el){var i=+el.dataset.bl,w=S.cl[i];el.textContent=w===null?(i+1):S.words[w];el.classList.toggle('empty',w===null);el.classList.toggle('on',S.selBlank===i);});
  all('.chip[data-cw]').forEach(function(el){el.classList.toggle('used',S.cl.indexOf(+el.dataset.cw)>=0);});
  enableCheck(S.cl.every(function(x){return x!==null;}));
}
/* sort */
function drawSort(){
  var q=S.qs[S.i];
  all('.cat').forEach(function(el){el.classList.toggle('on',S.srt[+el.dataset.si]===+el.dataset.sc);});
  enableCheck(Object.keys(S.srt).length===q.items.length);
}

var PRAISE=['¡Muy bien!','¡Excelente!','¡Genial!','¡Perfecto!','¡Bravo!','¡Así se hace!'];
var OOPS=['Casi…','¡Ups! Revisemos','No es así','Mirá bien'];
function check(choice){
  if(S.answered)return;
  var q=S.qs[S.i],ok=false,extra='';
  if(q.type==='mc'){
    ok=q.options[choice]===q.answer;
    all('.opt').forEach(function(el,k){el.disabled=true;if(q.options[k]===q.answer)el.classList.add('right');else if(k===choice)el.classList.add('wrong');});
  }else if(q.type==='label'){
    var D=DIAG[q.diag];ok=true;
    q.keys.forEach(function(k,i){var good=S.bank[S.lab[i]]===D.lbl[k];if(!good)ok=false;
      var row=document.querySelector('.lrow[data-row="'+i+'"]');row.classList.add(good?'right':'wrong');row.classList.remove('on');
      if(!good)row.querySelector('.v').innerHTML='<s>'+esc(S.bank[S.lab[i]])+'</s><span class="fix">Es: '+esc(D.lbl[k])+'</span>';
      var p=document.querySelector('.pin[data-row="'+i+'"]');if(p){p.classList.remove('on');p.classList.add(good?'right':'wrong');}});
    all('.lrow,.chip').forEach(function(el){el.disabled=true;});
  }else if(q.type==='match'){
    ok=true;q.pairs.forEach(function(p,l){var good=S.ml[l]===l;if(!good)ok=false;document.querySelector('.mi[data-ml="'+l+'"]').classList.add(good?'right':'wrong');});
    all('.mi').forEach(function(el){el.disabled=true;});
    if(!ok)extra='<p><b>Las parejas correctas son:</b></p><ul style="margin:0;padding-left:1.2em">'+q.pairs.map(function(p){return '<li>'+esc(p[0])+' → '+esc(p[1])+'</li>';}).join('')+'</ul>';
  }else if(q.type==='order'){
    ok=S.order.every(function(v,i){return v===i;});
    all('#pool .opt').forEach(function(el){el.disabled=true;});
    if(!ok)extra='<p><b>El orden correcto es:</b></p><ol style="padding-left:1.4em">'+q.items.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  }else if(q.type==='cloze'){
    var got=S.cl.map(function(w){return S.words[w];});
    if(q.any){var a=S.ans.slice().sort().join('|'),b=got.slice().sort().join('|');ok=a===b;
      all('.blank').forEach(function(el,i){el.classList.add(S.ans.indexOf(got[i])>=0?'right':'wrong');});}
    else{ok=true;all('.blank').forEach(function(el,i){var g=got[i]===S.ans[i];if(!g)ok=false;el.classList.add(g?'right':'wrong');});}
    all('.blank,.chip').forEach(function(el){el.disabled=true;});
    if(!ok)extra='<p><b>Así queda completo:</b> '+esc(q.text).replace(/\{([^}]+)\}/g,'<b><u>$1</u></b>')+'</p>';
  }else if(q.type==='sort'){
    ok=true;q.items.forEach(function(it,i){var good=S.srt[i]===it[1];if(!good)ok=false;var r=document.querySelector('.srow[data-srow="'+i+'"]');r.classList.add(good?'right':'wrong');
      if(!good)r.querySelector('.it').innerHTML=esc(it[0])+'<span class="fix">Va en: '+esc(q.cats[it[1]])+'</span>';});
    all('.cat').forEach(function(el){el.disabled=true;});
  }else if(q.type==='plate'){
    var f=q.food;ok=choice===f[2];
    all('.grp').forEach(function(el){el.disabled=true;if(el.dataset.g===f[2])el.classList.add('right');else if(el.dataset.g===choice)el.classList.add('wrong');});
    all('.sector.clickable').forEach(function(el){el.classList.remove('clickable');if(el.dataset.g===f[2])el.classList.add('right');else if(el.dataset.g===choice)el.classList.add('wrong');el.style.cursor='default';});
    q.explain=f[3]||(esc(f[1])+' va en el grupo <b>'+esc(gByK(f[2]).n)+'</b>.');
  }
  S.answered=true;
  if(ok){S.score++;sOk();}else{S.wrong.push(q);sBad();}
  enableCheck(false);all('[data-act=oreset]').forEach(function(el){el.disabled=true;});
  var fb=document.getElementById('fb');
  fb.innerHTML='<div class="fb '+(ok?'ok':'bad')+'"><p class="verdict">'+(ok?rnd(PRAISE):rnd(OOPS))+'</p>'+(q.explain?'<p>'+q.explain+'</p>':'')+(ok?'':extra)+
   '<button class="btn" data-act="next">'+(S.i+1<S.qs.length?'Siguiente →':'Ver resultado')+'</button></div>';
  var nb=fb.querySelector('[data-act=next]');nb.focus({preventScroll:true});fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function renderResult(){
  var total=S.qs.length,pct=S.score/total,n=starsFor(pct);
  if(S.topicId)saveBest(S.topicId,pct);
  if(n>=2)sWin();
  var msg=n===3?'¡Lo sabés muy bien! Estás listo para la comprobación.':n===2?'¡Muy bien! Repasá los errores y vas a llegar a las tres estrellas.':n===1?'Vas bien. Volvé a leer el repaso y probá otra vez.':'Leé el repaso con calma y volvé a intentarlo.';
  app.innerHTML=topbar()+'<section class="qcard result"><p class="qtag mono">'+esc(S.title)+'</p><span class="big">'+S.score+' / '+total+'</span>'+starStr(pct)+'<p>'+msg+'</p>'+
   '<div class="actions">'+(S.wrong.length?'<button class="btn" data-act="review">Repasar mis errores ('+S.wrong.length+')</button>':'')+
   (S.topicId?'<button class="btn'+(S.wrong.length?' ghost':'')+'" data-act="start" data-id="'+S.topicId+'">Jugar otra vez</button>':'')+
   '<button class="btn ghost" data-act="home">Volver a los temas</button></div></section>';
  window.scrollTo(0,0);
}
/* ---------- V o F relámpago ---------- */
function startClock(){
  stopClock();S=null;C={left:60,score:0,tries:0,deck:shuffle(TF_ALL),k:0,lock:false,timer:null};nextClock();
  C.timer=setInterval(function(){if(!C)return;C.left--;var el=document.getElementById('ctime');if(el){el.textContent=C.left+' s';el.classList.toggle('low',C.left<=10);}if(C.left<=0)endClock();},1000);
}
function nextClock(){
  if(C.k>=C.deck.length){C.deck=shuffle(TF_ALL);C.k=0;}
  C.cur=C.deck[C.k++];C.lock=false;
  app.innerHTML=topbar()+'<div class="c-'+C.cur.sys+'"><div class="clock"><button class="link" data-act="home">← Salir</button><span>✔ '+C.score+'</span><span class="time'+(C.left<=10?' low':'')+'" id="ctime">'+C.left+' s</span></div>'+
   '<section class="qcard" id="ccard" style="margin-top:14px"><p class="qtag mono">V o F relámpago</p><p class="stmt">'+esc(C.cur.s)+'</p>'+
   '<div class="options tf"><button class="opt" data-cv="1">Verdadero</button><button class="opt" data-cv="0">Falso</button></div></section></div>';
}
function answerClock(v){
  if(!C||C.lock)return;C.lock=true;C.tries++;
  var ok=(v==='1')===C.cur.v,card=document.getElementById('ccard');
  all('.opt').forEach(function(el){el.disabled=true;if((el.dataset.cv==='1')===C.cur.v)el.classList.add('right');else if(el.dataset.cv===v)el.classList.add('wrong');});
  if(ok){C.score++;sOk();card.classList.add('flash-ok');}else{sBad();card.classList.add('flash-bad');}
  setTimeout(function(){if(C&&C.left>0)nextClock();},ok?450:1200);
}
function endClock(){
  var score=C.score,tries=C.tries;clearInterval(C.timer);C=null;var rec=saveBest('reloj',score);sWin();
  app.innerHTML=topbar()+'<section class="qcard result"><p class="qtag mono">V o F relámpago</p><span class="big">'+score+'</span><p>aciertos en un minuto ('+tries+' respondidas)</p><p><b>'+(rec&&score>0?'¡Nuevo récord!':'Tu récord: '+(loadBest().reloj||0))+'</b></p>'+
   '<div class="actions"><button class="btn" data-act="clock">Jugar otra vez</button><button class="btn ghost" data-act="home">Volver a los temas</button></div></section>';
}

/* ---------- eventos ---------- */
app.addEventListener('click',function(e){
  var el=e.target.closest('button,.pin[data-row],.sector[data-g]');if(!el||el.disabled)return;
  var act=el.dataset?el.dataset.act:null;
  if(act==='home')return renderHome();
  if(act==='mute'){muted=!muted;sset('-mute',muted);el.textContent=muted?'🔇':'🔊';el.setAttribute('aria-label',muted?'Activar sonido':'Silenciar');return;}
  if(act==='lesson')return renderLesson(el.dataset.id);
  if(act==='start')return startRound(el.dataset.id);
  if(act==='clock')return startClock();
  if(act==='review')return startRound(null,shuffle(S.wrong));
  if(act==='next'){S.i++;if(S.i>=S.qs.length)return renderResult();renderQ();window.scrollTo({top:0});return;}
  if(act==='check')return check();
  if(act==='oreset'){S.order=[];drawOrder();return;}
  var d=el.dataset||{};
  if(d.cv!==undefined)return answerClock(d.cv);
  if(!S||S.answered)return;
  var q=S.qs[S.i];
  if(d.k!==undefined)return check(+d.k);
  if(d.g!==undefined&&q.type==='plate')return check(d.g);
  if(d.row!==undefined&&q.type==='label'){var r=+d.row;
    if(S.selChip!==null)return placeLabel(r,S.selChip);
    if(S.lab[r]!==undefined&&S.selRow===r){delete S.lab[r];}
    S.selRow=r;return drawLabel();}
  if(d.chip!==undefined){var c=+d.chip;
    if(S.selRow!==null){return placeLabel(S.selRow,c);}
    S.selChip=S.selChip===c?null:c;return drawLabel();}
  if(d.ml!==undefined){var l=+d.ml;if(S.selR!==null)return pairUp(l,S.selR);if(S.ml[l]!==undefined&&S.selL===null){delete S.ml[l];}S.selL=S.selL===l?null:l;return drawMatch();}
  if(d.mr!==undefined){var rr=+d.mr;if(S.selL!==null)return pairUp(S.selL,rr);
    var owner=null;Object.keys(S.ml).forEach(function(k){if(S.ml[k]===rr)owner=k;});if(owner!==null&&S.selR===null){delete S.ml[owner];}
    S.selR=S.selR===rr?null:rr;return drawMatch();}
  if(d.oi!==undefined){S.order.push(+d.oi);drawOrder();return;}
  if(d.bl!==undefined){var b=+d.bl;if(S.cl[b]!==null){S.cl[b]=null;}S.selBlank=b;drawCloze();return;}
  if(d.cw!==undefined){var w=+d.cw;if(S.cl.indexOf(w)>=0)return;
    var tgt=S.selBlank!==null&&S.cl[S.selBlank]===null?S.selBlank:S.cl.indexOf(null);
    if(tgt<0)return;S.cl[tgt]=w;S.selBlank=null;drawCloze();return;}
  if(d.si!==undefined){S.srt[+d.si]=+d.sc;drawSort();return;}
});

window.__PI={cur:function(){return S&&S.qs[S.i];},st:function(){return S;},TOPICS:TOPICS,T:T,DIAG:DIAG,FOODS:FOODS,TF_ALL:TF_ALL,examQs:examQs};
renderHome();
})();
</script>
