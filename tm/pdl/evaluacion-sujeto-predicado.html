<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Evaluación de PDL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Lexend:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* Layout: una hoja de carpeta cuadriculada con margen rojo. Las actividades son fichas
   pegadas con cinta; el sujeto siempre en verde agua y el predicado en frambuesa,
   con los corchetes y siglas escritos "a mano" como en la carpeta. */
:root{
  --paper:#fffdf6; --grid:#e1eaf4; --margin:#f0a6a6;
  --ink:#1d2742; --ink-2:#56607a; --line:#cfd8e6; --card:#ffffff; --card-2:#f6f8fc;
  --suj:#087a73; --suj-bg:#d6f1ec;
  --pred:#c22a5f; --pred-bg:#fde2eb;
  --hl:#ffe24a; --tape:#f7d77c;
  --ok:#2b8a3e; --ok-bg:#e4f6e7; --bad:#c2410c; --bad-bg:#fff0e5;
  --f-display:'Grandstander','Comic Sans MS',system-ui,sans-serif;
  --f-body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-hand:'Patrick Hand','Comic Sans MS',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{
  font-family:var(--f-body);color:var(--ink);font-size:16px;line-height:1.5;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  min-height:100vh;-webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;top:0;bottom:0;left:clamp(6px,calc(50% - 470px),100vw);width:2px;background:var(--margin);pointer-events:none}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:8px 56px;position:relative}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}
.t-s{color:var(--suj)} .t-p{color:var(--pred)}
.hl{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);padding-inline:.08em}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding-block:12px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:1.15rem;padding:4px}
.brand .seal{font-family:var(--f-hand);font-weight:400;font-size:1rem;border:2px solid var(--ink);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;background:var(--hl);transform:rotate(-6deg)}
.top .sp{flex:1}
.hub{color:var(--ink-2);font-weight:600;font-size:.9rem;text-decoration:none}
.hub:hover{color:var(--ink);text-decoration:underline}
.iconbtn{background:var(--card);border:2px solid var(--ink);border-radius:12px;width:42px;height:42px;cursor:pointer;font-size:1.1rem}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start;padding-block:10px 6px}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.eyebrow{font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px}
.hero h1{font-size:clamp(2.1rem,7vw,3.3rem);font-weight:800}
.hero p.lead{margin:12px 0 0;color:var(--ink-2);max-width:46ch}
.postit{background:#fff4a8;border:2px solid var(--ink);padding:14px 16px 12px;transform:rotate(1.5deg);box-shadow:5px 6px 0 rgba(29,39,66,.12)}
.postit h2{font-size:1.05rem;margin-bottom:8px}
.dates{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.dates li{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-hand);font-size:1.25rem;line-height:1.2}
.dates b{font-family:var(--f-body);font-size:.95rem}
.countdown{margin:10px 0 0;font-weight:700;font-size:.9rem}
.sample{grid-column:1/-1;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px}
.sample .cap{font-size:.8rem;font-weight:600;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}

/* sections & cards */
.sec-title{display:flex;align-items:baseline;gap:10px;margin:34px 0 14px}
.sec-title h2{font-size:1.45rem}
.sec-title span{color:var(--ink-2);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 16px}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.grid{grid-template-columns:1fr}}
.card{position:relative;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:20px 16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:4px 4px 0 var(--line);transition:transform .12s,box-shadow .12s}
.card::before{content:"";position:absolute;top:-10px;left:50%;width:62px;height:18px;transform:translateX(-50%) rotate(-3deg);background:var(--tape);opacity:.9}
.card:nth-child(even)::before{transform:translateX(-50%) rotate(2.5deg)}
.card:hover{transform:translateY(-2px);box-shadow:6px 7px 0 var(--line)}
.card .sig{font-family:var(--f-hand);font-size:1.2rem;line-height:1;color:var(--ink-2)}
.card .ct{display:block;font-family:var(--f-display);font-size:1.12rem;font-weight:800;line-height:1.15}
.card .sub{font-size:.88rem;color:var(--ink-2)}
.card .meta{margin-top:auto;padding-top:6px}
.stars{color:#e8a400;font-size:1.05rem;letter-spacing:2px}
.stars .off{color:var(--line)}
.stars.none{font-size:.8rem;letter-spacing:0;color:var(--ink-2)}
.exam{display:flex;align-items:center;gap:16px;width:100%;text-align:left;margin-top:26px;background:var(--ink);color:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:18px 20px;cursor:pointer;box-shadow:5px 5px 0 var(--hl)}
.exam .big{font-family:var(--f-hand);font-size:1.6rem;border:2px dashed var(--hl);border-radius:10px;padding:2px 10px;color:var(--hl)}
.exam .t{display:block;font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.exam .s{display:block;font-size:.9rem;opacity:.85}
.exam .stars .off{color:#56607a}
.exam > span:nth-child(2){flex:1;min-width:0}

/* lesson */
.lesson-head{display:flex;gap:14px;align-items:center;margin:8px 0 16px}
.lesson-head .sig{font-family:var(--f-hand);font-size:1.4rem;border:2px solid var(--ink);border-radius:12px;padding:4px 10px;background:var(--hl);transform:rotate(-3deg)}
.lesson-head h1{font-size:clamp(1.6rem,5vw,2.2rem)}
.lesson-head p{margin:2px 0 0;color:var(--ink-2);font-size:.9rem}
.sheet{background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px;
  background-image:linear-gradient(var(--card) 0,var(--card) 100%)}
.sheet h3{font-size:1.15rem;margin-top:6px}
.sheet p,.sheet ul{margin:0;max-width:68ch}
.sheet ul{padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.tip{background:var(--card-2);border-left:4px solid var(--hl);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.95rem}
.ex{background:var(--card-2);border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto}
.ex .q{font-size:.9rem;color:var(--ink-2);margin:6px 0 0}
table.end{border-collapse:collapse;font-size:.95rem}
table.end td,table.end th{border:1.5px solid var(--line);padding:6px 10px;text-align:left}
table.end th{background:var(--card-2)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{background:var(--ink);color:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;font-size:1rem}
.btn:hover{background:#2c3a60}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.ghost:hover{background:var(--card-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.texts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:4px}
@media (max-width:560px){.texts{grid-template-columns:1fr}}

/* analysis in "formato carpeta" */
.an{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px 12px;font-size:1.12rem;line-height:1.3}
.seg{display:inline-flex;flex-direction:column;min-width:0;max-width:100%}
.wrow{display:flex;flex-wrap:wrap;gap:0 .3em;padding-top:1.05em}
.w{position:relative;white-space:nowrap}
.w.nuc{font-weight:600}
.mk{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-family:var(--f-hand);font-style:normal;font-weight:400;font-size:1em;line-height:1.05}
.brk{position:relative;margin-top:3px;padding-top:.72em;text-align:center;font-family:var(--f-hand);font-size:1.1em;line-height:1}
.brk::before{content:"";position:absolute;top:0;left:1px;right:1px;height:.5em;border:2.5px solid currentColor;border-top:0;border-radius:0 0 6px 6px}
.seg-s .mk,.seg-s .brk{color:var(--suj)}
.seg-p .mk,.seg-p .brk{color:var(--pred)}
.seg-st{color:var(--suj)}
.seg-st .w{font-family:var(--f-hand);font-size:1.05em}
.seg-st .brk::before{border-style:dashed}

/* question */
.qhead{display:flex;align-items:center;gap:12px;font-weight:600;font-size:.92rem}
.qhead .count{margin-left:auto;color:var(--ink-2)}
.qhead .score{color:var(--ok)}
.link{background:none;border:0;cursor:pointer;color:var(--ink-2);font-weight:600;padding:4px 0}
.link:hover{color:var(--ink);text-decoration:underline}
.bar{height:10px;border:2px solid var(--ink);border-radius:99px;margin:10px 0 18px;overflow:hidden;background:var(--card)}
.bar span{display:block;height:100%;background:var(--hl);transition:width .3s}
.qcard{background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:5px 5px 0 var(--line)}
.qtag{margin:0;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.prompt{font-family:var(--f-body);font-weight:600;font-size:1.12rem;line-height:1.4;margin:0}
.sent{font-size:1.3rem;font-weight:500;background:var(--card-2);border-radius:10px;padding:12px 14px;border-bottom:2px solid var(--line)}
.passage{border:1.5px solid var(--line);border-radius:10px;background:var(--card-2)}
.passage summary{cursor:pointer;padding:10px 14px;font-weight:700}
.passage .ptext{padding:0 16px 14px;max-height:46vh;overflow:auto;font-size:1rem;line-height:1.65}
.passage .ptext p{margin:0 0 .7em}
.passage h4{font-family:var(--f-display);font-size:1.1rem;margin:4px 0 8px}
.passage h5{font-size:.95rem;margin:10px 0 2px}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.options.stack{grid-template-columns:1fr}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:1rem;display:flex;flex-direction:column;gap:2px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt b{font-family:var(--f-hand);font-weight:400;font-size:1.4rem;line-height:1}
.opt small{color:var(--ink-2);font-size:.85rem}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.toks{display:flex;flex-wrap:wrap;gap:8px}
.tok{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:6px 11px;font-size:1.15rem;cursor:pointer;line-height:1.3}
.tok:hover:not(:disabled){border-color:var(--ink)}
.tok.in-s{background:var(--suj-bg);border-color:#8fd3c9}
.tok.in-p{background:var(--pred-bg);border-color:#f3a8c1}
.tok.sel{background:var(--hl);border-color:var(--ink)}
.tok.right{background:var(--ok-bg);border-color:var(--ok)}
.tok.wrong{background:var(--bad-bg);border-color:var(--bad);text-decoration:line-through}
.tok.missed{border-color:var(--ok);border-style:dashed}
.tok:disabled{cursor:default}
.tok-st{font-size:.95rem;font-weight:600;border-style:dashed}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.build{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.build{grid-template-columns:1fr}}
.build h4{margin:0 0 6px;font-size:.9rem}
.chips{display:flex;flex-direction:column;gap:8px}
.chip{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:1.02rem}
.chip.s.sel{background:var(--suj-bg);border-color:var(--suj)}
.chip.p.sel{background:var(--pred-bg);border-color:var(--pred)}
.chip:disabled{cursor:default}
.preview{min-height:3em;background:var(--card-2);border-radius:10px;padding:10px 14px;font-size:1.15rem;border-bottom:2px solid var(--line)}
.preview .ph{color:var(--ink-2);font-size:.95rem}
.target{display:inline-flex;gap:8px;align-items:center;font-family:var(--f-hand);font-size:1.5rem;line-height:1}
.target .ts{color:var(--suj)} .target .tp{color:var(--pred)}
.slots{display:flex;flex-direction:column;gap:8px;counter-reset:s}
.slot{display:flex;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:10px;padding:8px 12px;min-height:44px}
.slot .n{font-family:var(--f-hand);font-size:1.3rem;width:1.2em;color:var(--ink-2)}
.slot.filled{border-style:solid;border-color:var(--ink);background:var(--card)}
.typeform{display:flex;gap:10px;flex-wrap:wrap}
.fb{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;border:2px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb .verdict{font-family:var(--f-display);font-weight:800;font-size:1.2rem;margin:0}
.fb.ok .verdict{color:var(--ok)} .fb.bad .verdict{color:var(--bad)}
.fb p{margin:0}
.fb .an{background:var(--card);border-radius:10px;padding:8px 12px 10px}
.fb .btn{align-self:flex-start}

/* result */
.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:24px 18px}
.result .big{font-family:var(--f-display);font-weight:800;font-size:3.2rem;line-height:1}
.result .stars{font-size:2rem}
.result p{margin:0;color:var(--ink-2)}
.result .actions{justify-content:center}

/* clock game */
.clock{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-weight:800;font-size:1.4rem}
.clock .time{font-variant-numeric:tabular-nums;border:2px solid var(--ink);border-radius:12px;padding:4px 12px;background:var(--hl)}
.clock .time.low{background:var(--bad-bg);color:var(--bad)}
.flash-ok{animation:fok .45s}
.flash-bad{animation:fbad .45s}
@keyframes fok{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes fbad{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
footer{text-align:center;color:var(--ink-2);font-size:.85rem;padding-top:36px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var HUB='../../home.html';

/* ---------- utilidades ---------- */
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a,n){return shuffle(a).slice(0,n);}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
var STORE='pdl5-evaluacion';
function sget(k,d){try{var v=localStorage.getItem(STORE+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function sset(k,v){try{localStorage.setItem(STORE+k,JSON.stringify(v));}catch(e){}}
function loadBest(){var b=sget('-best',{});return (b&&typeof b==='object')?b:{};}
function saveBest(id,val){var b=loadBest();if(b[id]===undefined||val>b[id]){b[id]=val;sset('-best',b);return true;}return false;}

/* ---------- sonido ---------- */
var muted=!!sget('-mute',false),actx=null;
function tone(fs,d,type){if(muted)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();var t=actx.currentTime;fs.forEach(function(f,i){var o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t+i*d);g.gain.exponentialRampToValueAtTime(0.16,t+i*d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+(i+1)*d);o.connect(g);g.connect(actx.destination);o.start(t+i*d);o.stop(t+(i+1)*d+0.03);});}catch(e){}}
function sOk(){tone([660,880],0.09,'triangle');}
function sBad(){tone([240,190],0.13,'square');}
function sWin(){tone([523,659,784,1046],0.11,'triangle');}

/* ---------- oraciones ----------
   S: sujeto, P: predicado, separados por |. Los núcleos van entre *asteriscos*.
   Las oraciones con sujeto tácito llevan la persona: yo, vos, el, nos, ellos. */
var PRON={yo:'yo',vos:'vos',el:'él / ella',nos:'nosotros / nosotras',ellos:'ellos / ellas'};
var PRON_SHORT={yo:'yo',vos:'vos',el:'él/ella',nos:'nosotros',ellos:'ellos'};
var PRON_ORDER=['yo','vos','el','nos','ellos'];
var BANK=[
 // SES + PVS
 ['S:El *perro* de mi vecino|P:*ladra* toda la noche.'],
 ['S:La *maestra*|P:*explicó* el tema en el pizarrón.'],
 ['S:Mi *abuela*|P:*prepara* empanadas los domingos.'],
 ['S:Los *chicos* de quinto|P:*organizaron* una feria de ciencias.'],
 ['S:Un *colibrí* verde|P:*visitó* las flores del jardín.'],
 ['S:*Martina*|P:*ganó* el concurso de dibujo.'],
 ['S:El *tren*|P:*llegó* tarde a la estación.'],
 ['S:Las *hojas* secas|P:*cubren* la vereda.'],
 ['S:Mi *papá*|P:*arregló* la bicicleta.'],
 ['S:La *biblioteca* de la escuela|P:*recibió* libros nuevos.'],
 ['S:*Nosotros*|P:*visitamos* el museo de ciencias.'],
 ['S:*Ella*|P:*escribe* cuentos de misterio.'],
 ['S:El *equipo* de handball|P:*entrena* los martes.'],
 ['S:Las *nubes* grises|P:*anunciaban* una tormenta.'],
 ['S:Mi *gato*|P:no *come* verduras.'],
 ['S:*Ellos*|P:*construyeron* un castillo de arena.'],
 // SEC + PVS
 ['S:*Tomás* y *Lucía*|P:*juegan* al ajedrez.'],
 ['S:Mi *mamá* y mi *tía*|P:*viajaron* a Córdoba.'],
 ['S:Los *gatos* y los *perros*|P:*necesitan* muchos cuidados.'],
 ['S:El *director* y las *maestras*|P:*prepararon* el acto.'],
 ['S:*Juan*, *Sofía* y *Bruno*|P:*armaron* una maqueta.'],
 ['S:La *luna* y las *estrellas*|P:*iluminaban* el campo.'],
 ['S:Las *rosas* y los *jazmines*|P:*perfuman* el patio.'],
 ['S:Mi *hermano* y *yo*|P:*hicimos* la tarea juntos.'],
 // SES + PVC
 ['S:El *payaso*|P:*cantó* y *bailó* en el escenario.'],
 ['S:Mi *prima*|P:*lee* y *escribe* poesías.'],
 ['S:El *viento*|P:*sopló* fuerte y *derribó* un árbol.'],
 ['S:La *profesora*|P:*corrigió* las pruebas y *repartió* las notas.'],
 ['S:*Lautaro*|P:*corre*, *salta* y *nada* muy bien.'],
 ['S:El *cocinero*|P:*cortó* las verduras y *preparó* una sopa.'],
 ['S:Un *zorro* astuto|P:*entró* al gallinero y *robó* un huevo.'],
 // SEC + PVC
 ['S:*Pedro* y *Ana*|P:*cantan* y *bailan* en la fiesta.'],
 ['S:Los *alumnos* y la *maestra*|P:*plantaron* árboles y *regaron* la huerta.'],
 ['S:Mi *abuelo* y mi *papá*|P:*pescaron* en el río y *cocinaron* los pescados.'],
 ['S:Las *nenas* y los *nenes*|P:*saltaban* y *gritaban* en el recreo.'],
 ['S:El *perro* y el *gato*|P:*comieron* y *durmieron* toda la tarde.'],

var TOKRE=/^([¡¿«"(]*)(\*?)(.+?)(\*?)([.,;:!?»")]*)$/;
function parse(src,tac){
  var s={src:src,tac:tac||null,tokens:[],sIdx:[],nIdx:[],pIdx:[],nvIdx:[]};
  src.split('|').forEach(function(part,si){
    var role=part.charAt(0),text=part.slice(2).trim();
    text.split(/\s+/).forEach(function(tok){
      var m=tok.match(TOKRE);
      var t={pre:m[1],word:m[3],post:m[5],nuc:m[2]==='*',role:role,seg:si,i:s.tokens.length};
      s.tokens.push(t);
      if(role==='S'){s.sIdx.push(t.i);if(t.nuc)s.nIdx.push(t.i);}else{s.pIdx.push(t.i);if(t.nuc)s.nvIdx.push(t.i);}
    });
  });
  s.sType=s.sIdx.length===0?'ST':(s.nIdx.length>1?'SEC':'SES');
  s.pType=s.nvIdx.length>1?'PVC':'PVS';
  s.inv=s.sIdx.length>0&&s.sIdx[0]>s.pIdx[0];
  s.text=s.tokens.map(function(t){return t.pre+t.word+t.post;}).join(' ');
  return s;
}
var SENTS=BANK.map(function(b){return parse(b[0],b[1]);});
function byType(fn){return SENTS.filter(fn);}

function words(s,idx){return idx.map(function(i){return s.tokens[i].word;});}
function phrase(s,idx){return idx.map(function(i){var t=s.tokens[i];return t.pre+t.word+t.post;}).join(' ').replace(/[.!?]$/,'');}
function qq(w){return '«'+esc(w)+'»';}
function listW(a){a=a.map(qq);return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' y '+a[a.length-1];}
var NUMW=['cero','un','dos','tres','cuatro'];

function renderAn(s){
  var h='<div class="an">';
  if(s.sType==='ST')h+='<span class="seg seg-st"><span class="wrow"><span class="w">('+esc(PRON_SHORT[s.tac])+')</span></span><span class="brk">ST</span></span>';
  var groups=[];
  s.tokens.forEach(function(t){var g=groups[groups.length-1];if(!g||g.seg!==t.seg){g={seg:t.seg,role:t.role,toks:[]};groups.push(g);}g.toks.push(t);});
  groups.forEach(function(g){
    var isS=g.role==='S';
    h+='<span class="seg '+(isS?'seg-s':'seg-p')+'"><span class="wrow">'+g.toks.map(function(t){
      return '<span class="w'+(t.nuc?' nuc':'')+'">'+(t.nuc?'<i class="mk">'+(isS?'n':'nv')+'</i>':'')+esc(t.pre+t.word+t.post)+'</span>';
    }).join('')+'</span><span class="brk">'+(isS?s.sType:s.pType)+'</span></span>';
  });
  return h+'</div>';
}
function an(src,tac){return renderAn(parse(src,tac));}

function explainS(s){
  if(s.sType==='ST')return 'El sujeto no está escrito, pero el verbo '+listW(words(s,s.nvIdx.slice(0,1)))+' nos dice quién hace la acción: <b>'+PRON[s.tac]+'</b>. Es un <b>sujeto tácito (ST)</b>.';
  var n=s.nIdx.length;
  if(n===1)return 'El sujeto es '+qq(phrase(s,s.sIdx))+'. Tiene un solo núcleo, '+qq(words(s,s.nIdx)[0])+', así que es un <b>sujeto expreso simple (SES)</b>.';
  return 'El sujeto es '+qq(phrase(s,s.sIdx))+'. Tiene '+NUMW[n]+' núcleos, '+listW(words(s,s.nIdx))+', así que es un <b>sujeto expreso compuesto (SEC)</b>.';
}
function explainP(s){
  var n=s.nvIdx.length;
  if(n===1)return 'El predicado tiene un solo núcleo verbal, '+qq(words(s,s.nvIdx)[0])+': es un <b>predicado verbal simple (PVS)</b>.';
  return 'El predicado tiene '+NUMW[n]+' núcleos verbales, '+listW(words(s,s.nvIdx))+': es un <b>predicado verbal compuesto (PVC)</b>.';
}

function fullSteps(s,k,of){

  else{
    steps.push(qPickN(s,{quiet:true,explain:'El núcleo del sujeto: '+listW(words(s,s.nIdx))+'.'}));
    steps.push(qClassS(s,{visual:'',quiet:true,explain:explainS(s)}));
  }
  steps.push(qPickNv(s,{quiet:true,explain:'Núcleo verbal: '+listW(words(s,s.nvIdx))+'.'}));
  steps.push(qClassP(s,{visual:'',explain:explainP(s)+' ¡Así queda el análisis completo!'}));
  steps.forEach(function(q,i){q.tag=head+(i+1)+' de '+steps.length;q.prompt='<span>'+q.prompt+'</span>';if(q.type==='mc'&&q.visual==='')q.visual=sentBox(s);});
  return steps;
}

function examQs(){
  var withS=byType(function(s){return s.sType!=='ST';}),st=byType(function(s){return s.sType==='ST';});
  var g=[];
  pick(SENTS,2).forEach(function(s){g.push(qPickS(s));});
  pick(withS,2).forEach(function(s){g.push(qClassS(s));});
  g.push(qTac(rnd(st)));
  g.push(qPickN(rnd(withS)));
  g.push(qPickNv(rnd(SENTS)));
  pick(byType(function(s){return s.pType==='PVS';}),1).concat(pick(byType(function(s){return s.pType==='PVC';}),1)).forEach(function(s){g.push(qClassP(s));});
  g.push(qBuild());
  var T=rnd(TEXTS),tq=textQs(T);
  var lect=[tq[0]].concat(pick(tq.slice(1),3));
  lect.sort(function(a,b){return tq.indexOf(a)-tq.indexOf(b);});
  return shuffle(g).concat(lect);
}

  var body='';
  if(q.type==='mc'){
    body='<div class="options '+(q.optClass||'')+'">'+q.options.map(function(o,k){return '<button class="opt" data-k="'+k+'">'+o.html+'</button>';}).join('')+'</div>';
  }else if(q.type==='pick'){
    var s=q.s;
    body='<div class="toks" role="group" aria-label="Palabras de la oración">'+s.tokens.map(function(t){
      var cls='tok';
      if(q.mode==='n'&&t.role==='S')cls+=' in-s';
      if(q.mode==='nv'&&t.role==='P')cls+=' in-p';
      return '<button class="'+cls+'" data-tok="'+t.i+'" aria-pressed="false">'+esc(t.pre+t.word+t.post)+'</button>';}).join('')+'</div>'+
      (q.mode==='S'?'<div class="toks"><button class="tok tok-st" data-tok="st" aria-pressed="false">Sujeto tácito (no está escrito)</button></div>':'')+
      '<div class="actions" style="margin-top:0"><button class="btn" data-act="check">Comprobar</button></div>';
  }else if(q.type==='order'){
    S.orderItems=shuffle(q.items.map(function(x,i){return i;}));
    body='<div class="slots" id="slots"></div><div class="options stack" id="pool"></div>'+
      '<div class="actions" style="margin-top:0"><button class="btn" data-act="check" id="ocheck" disabled>Comprobar</button><button class="btn ghost" data-act="oreset">Empezar de nuevo</button></div>';
  }else if(q.type==='build'){
    body='<div class="target" aria-label="Estructura pedida"><span class="ts">'+q.target.s+'</span>+<span class="tp">'+q.target.p+'</span></div>'+
      '<div class="preview" id="preview"><span class="ph">Tu oración va a aparecer acá.</span></div>'+
      '<div class="build"><div><h4 class="t-s">Elegí un sujeto</h4><div class="chips">'+q.subs.map(function(x,k){return '<button class="chip s" data-bs="'+k+'">'+esc(plain(x.t))+'</button>';}).join('')+'</div></div>'+
      '<div><h4 class="t-p">Elegí un predicado</h4><div class="chips">'+q.preds.map(function(x,k){return '<button class="chip p" data-bp="'+k+'">'+esc(plain(x.t))+'</button>';}).join('')+'</div></div></div>'+
      '<div class="actions" style="margin-top:0"><button class="btn" data-act="check" id="bcheck" disabled>Comprobar</button></div>';
  }
  var passage='';
  if(q.passage){var T=textById(q.passage);passage=passageHTML(T,true);}
  app.innerHTML=topbar()+
   '<div class="qhead"><button class="link" data-act="home">← Temas</button><span class="count">'+(S.i+1)+' / '+S.qs.length+'</span><span class="score" aria-label="Respuestas correctas">✔ '+S.score+'</span></div>'+
   '<div class="bar"><span style="width:'+(S.i/S.qs.length*100)+'%"></span></div>'+
   '<section class="qcard">'+(q.tag?'<p class="qtag">'+esc(q.tag)+'</p>':'')+passage+(q.visual||'')+
   '<h2 class="prompt">'+q.prompt+'</h2>'+body+'<div id="fb" aria-live="polite"></div></section>';
  if(q.type==='order')drawOrder();
}
function drawOrder(){
  var q=S.qs[S.i];
  var slots=document.getElementById('slots'),pool=document.getElementById('pool');
  slots.innerHTML=q.items.map(function(x,i){var v=S.order[i];return '<div class="slot'+(v!==undefined?' filled':'')+'"><span class="n">'+(i+1)+'</span><span>'+(v!==undefined?esc(q.items[v]):'')+'</span></div>';}).join('');
  pool.innerHTML=S.orderItems.filter(function(i){return S.order.indexOf(i)<0;}).map(function(i){return '<button class="opt" data-oi="'+i+'">'+esc(q.items[i])+'</button>';}).join('');
  document.getElementById('ocheck').disabled=S.order.length!==q.items.length||S.answered;
}
function drawPreview(){
  var q=S.qs[S.i],p=document.getElementById('preview');
  var a=S.bs!==null?'<span class="t-s">'+esc(plain(q.subs[S.bs].t))+'</span>':'<span class="ph">(sujeto)</span>';
  var b=S.bp!==null?'<span class="t-p">'+esc(plain(q.preds[S.bp].t))+'</span>':'<span class="ph">(predicado)</span>';
  p.innerHTML=a+' '+b+(S.bs!==null&&S.bp!==null?'.':'');
  document.getElementById('bcheck').disabled=S.bs===null||S.bp===null;
  [].forEach.call(document.querySelectorAll('.chip.s'),function(el){el.classList.toggle('sel',+el.dataset.bs===S.bs);});
  [].forEach.call(document.querySelectorAll('.chip.p'),function(el){el.classList.toggle('sel',+el.dataset.bp===S.bp);});
}

var PRAISE=['¡Muy bien!','¡Excelente!','¡Genial!','¡Perfecto!','¡Bravo!','¡Así se hace!'];
var OOPS=['Casi…','¡Ups! Mirá bien','No es esa','Revisemos'];
function sameSet(a,b){if(a.length!==b.length)return false;var m={};a.forEach(function(x){m[x]=1;});return b.every(function(x){return m[x];});}

function check(choice){
  if(S.answered)return;
  var q=S.qs[S.i],ok=false,extra='';
  if(q.type==='mc'){
    var o=q.options[choice];ok=o.v===q.answer;
    [].forEach.call(document.querySelectorAll('.opt'),function(el,k){el.disabled=true;if(q.options[k].v===q.answer)el.classList.add('right');else if(k===choice)el.classList.add('wrong');});
  }else if(q.type==='pick'){
    var s=q.s,target=q.mode==='S'?s.sIdx:q.mode==='n'?s.nIdx:s.nvIdx;
    var sel=Object.keys(S.sel).filter(function(k){return S.sel[k]&&k!=='st';}).map(Number);
    if(q.mode==='S'&&s.sType==='ST')ok=!!S.sel.st&&sel.length===0;
    else ok=!S.sel.st&&sameSet(sel,target);
    [].forEach.call(document.querySelectorAll('.tok'),function(el){
      el.disabled=true;var k=el.dataset.tok;
      if(k==='st'){if(s.sType==='ST')el.classList.add(S.sel.st?'right':'missed');else if(S.sel.st)el.classList.add('wrong');return;}
      var i=+k,inT=target.indexOf(i)>=0,isSel=!!S.sel[i];
      el.classList.remove('sel');
      if(isSel&&inT)el.classList.add('right');else if(isSel&&!inT)el.classList.add('wrong');else if(!isSel&&inT)el.classList.add('missed');
    });
  }else if(q.type==='order'){
    ok=S.order.every(function(v,i){return v===i;});
    if(!ok)extra='<p><b>El orden correcto es:</b></p><ol style="margin:0;padding-left:1.3em">'+q.items.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  }else if(q.type==='build'){
    var a=q.subs[S.bs],b=q.preds[S.bp];
    var okS=a.k===q.target.s,okP=b.k===q.target.p,okN=a.n===b.n;
    ok=okS&&okP&&okN;
    [].forEach.call(document.querySelectorAll('.chip'),function(el){el.disabled=true;});
    var msgs=[];
    if(!okS)msgs.push('El sujeto '+qq(plain(a.t))+' es '+a.k+', pero te pedí '+q.target.s+'.');
    if(!okP)msgs.push('El predicado '+qq(plain(b.t))+' es '+b.k+', pero te pedí '+q.target.p+'.');
    if(!okN)msgs.push('No concuerdan: '+qq(plain(a.t))+' está en '+(a.n==='s'?'singular':'plural')+' y el verbo está en '+(b.n==='s'?'singular':'plural')+'.');
    var src;
    if(ok)src='S:'+a.t+'|P:'+b.t+'.';
    else{var gs=q.subs.filter(function(x){return x.k===q.target.s;})[0];var gp=q.preds.filter(function(x){return x.k===q.target.p&&x.n===gs.n;})[0];src='S:'+gs.t+'|P:'+gp.t+'.';}
    q.s=parse(src);
    q.explain=ok?'Tu oración cumple con '+q.target.s+' + '+q.target.p+' y el sujeto concuerda con el verbo.':msgs.join(' ')+' Una oración que sí funciona:';
  }
  S.answered=true;
  if(ok){S.score++;sOk();}else{S.wrong.push(q);sBad();}
  var showAn=q.s&&(!q.quiet||!ok);
  var fb=document.getElementById('fb');
  fb.innerHTML='<div class="fb '+(ok?'ok':'bad')+'"><p class="verdict">'+(ok?rnd(PRAISE):rnd(OOPS))+'</p>'+(q.explain?'<p>'+q.explain+'</p>':'')+extra+
    (showAn&&!q.quiet?renderAn(q.s):'')+
    '<button class="btn" data-act="next">'+(S.i+1<S.qs.length?'Siguiente →':'Ver resultado')+'</button></div>';
  var c=fb.querySelector('.btn[data-act=next]');
  if(c){c.focus({preventScroll:true});fb.scrollIntoView({behavior:'smooth',block:'nearest'});}
  [].forEach.call(document.querySelectorAll('[data-act=check],[data-act=oreset]'),function(el){el.disabled=true;});
}

function renderResult(){
  var total=S.qs.length,pct=S.score/total,n=starsFor(pct);
  if(S.topicId)saveBest(S.topicId,pct);
  if(n>=2)sWin();
  var msg=n===3?'¡Lo sabés muy bien! Estás listo para la evaluación.':n===2?'¡Muy bien! Repasá los errores y vas a llegar a las tres estrellas.':n===1?'Vas bien. Volvé a leer el repaso y probá otra vez.':'Leé el repaso con calma y volvé a intentarlo. ¡Practicando se aprende!';
  app.innerHTML=topbar()+'<section class="qcard result"><p class="qtag">'+esc(S.title)+'</p><span class="big">'+S.score+' / '+total+'</span>'+starStr(pct)+'<p>'+msg+'</p>'+
   '<div class="actions">'+(S.wrong.length?'<button class="btn" data-act="review">Repasar mis errores ('+S.wrong.length+')</button>':'')+
   (S.topicId?'<button class="btn'+(S.wrong.length?' ghost':'')+'" data-act="start" data-id="'+S.topicId+'">Jugar otra vez</button>':'')+
   '<button class="btn ghost" data-act="home">Volver a los temas</button></div></section>';
  window.scrollTo(0,0);
}

/* ---------- contrarreloj ---------- */
function startClock(){
  stopClock();S=null;
  C={left:60,score:0,tries:0,cur:null,timer:null,lock:false};
  nextClock();
  C.timer=setInterval(function(){if(!C)return;C.left--;var el=document.getElementById('ctime');if(el){el.textContent=C.left+' s';el.classList.toggle('low',C.left<=10);}if(C.left<=0)endClock();},1000);
}
function nextClock(){
  var s=rnd(SENTS),mode=Math.random()<.55?'S':'P';
  C.cur={s:s,mode:mode};C.lock=false;
  var opts=mode==='S'?OPT_S:OPT_P;
  app.innerHTML=topbar()+
   '<div class="clock"><button class="link" data-act="home">← Salir</button><span>✔ '+C.score+'</span><span class="time'+(C.left<=10?' low':'')+'" id="ctime">'+C.left+' s</span></div>'+
   '<section class="qcard" id="ccard" style="margin-top:14px"><p class="qtag">Contrarreloj · '+(mode==='S'?'Sujeto':'Predicado')+'</p>'+sentBox(s)+
   '<h2 class="prompt">¿Qué tipo de '+(mode==='S'?'<b class="t-s">sujeto</b>':'<b class="t-p">predicado</b>')+' tiene?</h2>'+
   '<div class="options">'+opts.map(function(o){return '<button class="opt" data-cv="'+o.v+'"><b>'+o.v+'</b><small>'+o.l+'</small></button>';}).join('')+'</div></section>';
}
function answerClock(v){
  if(!C||C.lock)return;C.lock=true;C.tries++;
  var right=C.cur.mode==='S'?C.cur.s.sType:C.cur.s.pType,ok=v===right;
  var card=document.getElementById('ccard');
  [].forEach.call(document.querySelectorAll('.opt'),function(el){el.disabled=true;if(el.dataset.cv===right)el.classList.add('right');else if(el.dataset.cv===v)el.classList.add('wrong');});
  if(ok){C.score++;sOk();card.classList.add('flash-ok');}else{sBad();card.classList.add('flash-bad');}
  setTimeout(function(){if(C&&C.left>0)nextClock();},ok?450:1100);
}
function endClock(){
  var score=C.score,tries=C.tries;clearInterval(C.timer);C=null;
  var rec=saveBest('reloj',score);sWin();
  app.innerHTML=topbar()+'<section class="qcard result"><p class="qtag">Contrarreloj</p><span class="big">'+score+'</span><p>aciertos en un minuto ('+tries+' respondidas)</p>'+
   '<p><b>'+(rec&&score>0?'¡Nuevo récord!':'Tu récord: '+(loadBest().reloj||0))+'</b></p>'+
   '<div class="actions"><button class="btn" data-act="clock">Jugar otra vez</button><button class="btn ghost" data-act="home">Volver a los temas</button></div></section>';
}

/* ---------- eventos ---------- */
app.addEventListener('click',function(e){
  var el=e.target.closest('button');if(!el||el.disabled)return;
  var act=el.dataset.act;
  if(act==='home')return renderHome();
  if(act==='mute'){muted=!muted;sset('-mute',muted);el.textContent=muted?'🔇':'🔊';el.setAttribute('aria-label',muted?'Activar sonido':'Silenciar');return;}
  if(act==='lesson')return renderLesson(el.dataset.id);
  if(act==='start')return startRound(el.dataset.id);
  if(act==='clock')return startClock();
  if(act==='review')return startRound(null,shuffle(S.wrong));
  if(act==='next'){S.i++;if(S.i>=S.qs.length)return renderResult();renderQ();window.scrollTo({top:0});return;}
  if(act==='check')return check();
  if(act==='oreset'){S.order=[];drawOrder();return;}
  if(el.dataset.cv!==undefined)return answerClock(el.dataset.cv);
  if(!S||S.answered)return;
  if(el.dataset.k!==undefined)return check(+el.dataset.k);
  if(el.dataset.tok!==undefined){
    var k=el.dataset.tok;
    if(k==='st'){S.sel={};[].forEach.call(document.querySelectorAll('.tok'),function(t){t.classList.remove('sel');t.setAttribute('aria-pressed','false');});}
    else if(S.sel.st){S.sel.st=false;var b=document.querySelector('.tok-st');b.classList.remove('sel');b.setAttribute('aria-pressed','false');}
    S.sel[k]=!S.sel[k];el.classList.toggle('sel',S.sel[k]);el.setAttribute('aria-pressed',S.sel[k]?'true':'false');return;
  }
  if(el.dataset.oi!==undefined){S.order.push(+el.dataset.oi);drawOrder();return;}
  if(el.dataset.bs!==undefined){S.bs=+el.dataset.bs;drawPreview();return;}
  if(el.dataset.bp!==undefined){S.bp=+el.dataset.bp;drawPreview();return;}
});

window.__PDL={cur:function(){return S&&S.qs[S.i];},SENTS:SENTS,TEXTS:TEXTS,TOPICS:TOPICS,parse:parse,examQs:examQs,qBuild:qBuild};
renderHome();
})();
</script>
