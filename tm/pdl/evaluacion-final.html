<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Evaluación final de PDL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Andika:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: noche de lapislázuli sobre el Nilo. El fondo es azul profundo con bandas doradas;
   el contenido se lee sobre hojas de papiro. El título va en un cartucho, como los nombres
   de los faraones. Los colores de los tiempos verbales y de los tipos de palabras son los
   mismos que usa la seño en sus láminas. */
:root{
  --lapis:#173a7c; --lapis-2:#0e2858; --gold:#ecbd4f; --gold-2:#c48f24;
  --papyrus:#fcf5e3; --papyrus-2:#f3e7c9; --ink:#2a2116; --ink-2:#6a5940; --line:#e2d2ab;
  --suj:#11867c; --suj-bg:#d3f0eb; --pred:#c0412b; --pred-bg:#fbe1da;
  --pps:#2f5fc4; --pps-bg:#dfe8fb; --pi:#3a8f33; --pi-bg:#e0f1dc; --ppc:#8a4fc4; --ppc-bg:#ece0f8;
  --agu:#d1453a; --gra:#4f9a2e; --esd:#8b4fbf;
  --ok:#23803a; --ok-bg:#e3f5e4; --bad:#c2410c; --bad-bg:#fff0e3; --sel:#ffe27a;
  --f-display:'Lilita One','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Andika','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{font-family:var(--f-body);color:var(--ink);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;min-height:100vh;
  background-color:var(--lapis);
  background-image:radial-gradient(rgba(236,189,79,.16) 1px,transparent 1.4px),linear-gradient(180deg,var(--lapis) 0,var(--lapis-2) 100%);
  background-size:26px 26px,100% 100%;background-attachment:fixed}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:6px 56px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.1;text-wrap:balance;margin:0;letter-spacing:.01em}
.label{font-weight:700;font-size:.76rem;letter-spacing:.09em;text-transform:uppercase}

/* top */
.top{display:flex;align-items:center;gap:10px;padding-block:12px;color:var(--papyrus)}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;cursor:pointer;font-family:var(--f-display);font-size:1.15rem;color:var(--papyrus);padding:4px}
.brand .eye{width:36px;height:36px}
.top .sp{flex:1}
.hub{color:var(--gold);font-weight:700;font-size:.92rem;text-decoration:none}
.hub:hover{text-decoration:underline}
.iconbtn{background:rgba(255,255,255,.1);border:1.5px solid rgba(236,189,79,.5);border-radius:12px;width:42px;height:42px;cursor:pointer;font-size:1.05rem}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-block:12px 4px;color:var(--papyrus)}
.cartouche{position:relative;border:4px double var(--gold);border-radius:999px;padding:16px 46px 16px 34px;background:rgba(14,40,88,.55)}
.cartouche::after{content:"";position:absolute;right:-4px;top:10%;bottom:10%;width:10px;border-radius:4px;background:var(--gold)}
.cartouche h1{font-size:clamp(1.9rem,7vw,3.2rem);color:var(--gold)}
.hero .sub{margin:0;max-width:48ch;color:#dfe6f5}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{display:inline-flex;gap:8px;align-items:center;background:var(--papyrus);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.95rem}
.pill.gold{background:var(--gold);color:var(--lapis-2)}
.nile{width:100%;max-width:560px;height:30px;display:block}
.nile path{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linecap:round;opacity:.8}

/* sections & cards */
.sec{margin-top:34px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;color:var(--papyrus);flex-wrap:wrap}
.sec-head h2{font-size:1.6rem;color:var(--gold)}
.sec-head p{margin:0;color:#c9d4ec;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.grid{grid-template-columns:1fr}}
.card{text-align:left;background:var(--papyrus);border:0;border-radius:6px;padding:16px 16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative;
  box-shadow:inset 0 0 0 1px var(--line),0 6px 0 -2px var(--papyrus-2);transition:transform .12s}
.card:hover{transform:translateY(-3px)}
.card .tag{align-self:flex-start;border-radius:999px;padding:2px 10px;color:#fff;background:var(--k,var(--lapis))}
.card .ct{font-family:var(--f-display);font-size:1.22rem;line-height:1.15}
.card .sub{color:var(--ink-2);font-size:.93rem}
.card .meta{margin-top:auto;padding-top:6px}
.stars{color:var(--gold-2);font-size:1.05rem;letter-spacing:2px}
.stars .off{color:var(--line)}
.stars.none{font-size:.82rem;letter-spacing:0;color:var(--ink-2)}
.k-lec{--k:#a0602a} .k-tie{--k:var(--pps)} .k-ace{--k:var(--agu)} .k-suj{--k:var(--suj)}
.big-actions{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:24px}
@media (max-width:560px){.big-actions{grid-template-columns:1fr}}
.exam{display:flex;align-items:center;gap:14px;text-align:left;background:var(--gold);color:var(--lapis-2);border:0;border-radius:16px;padding:18px 20px;cursor:pointer;box-shadow:0 6px 0 var(--gold-2)}
.exam:hover{filter:brightness(1.05)}
.exam:active{transform:translateY(3px);box-shadow:0 3px 0 var(--gold-2)}
.exam > span:first-child{flex:1;min-width:0}
.exam .t{display:block;font-family:var(--f-display);font-size:1.4rem}
.exam .s{display:block;font-size:.92rem}
.exam .stars{color:var(--lapis-2)} .exam .stars .off{color:rgba(14,40,88,.25)} .exam .stars.none{color:var(--lapis-2)}
.exam.alt{background:var(--papyrus);box-shadow:0 6px 0 var(--papyrus-2)}

/* lesson */
.lesson-head{display:flex;flex-direction:column;gap:6px;margin:6px 0 16px;color:var(--papyrus)}
.lesson-head .label{color:var(--gold)}
.lesson-head h1{font-size:clamp(1.9rem,6vw,2.6rem)}
.sheet{background:var(--papyrus);border-radius:8px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 0 1px var(--line)}
.sheet h3{font-size:1.3rem;margin-top:6px}
.sheet p,.sheet ul{margin:0;max-width:68ch}
.sheet ul{padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
.tip{background:var(--papyrus-2);border-radius:10px;padding:11px 14px;font-size:.98rem}
.ex{background:#fff;border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto}
.ex .q{font-size:.92rem;color:var(--ink-2);margin:6px 0 0}
.tbox{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--bg);border:2px solid var(--c)}
.tbox h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.15rem;color:var(--c)}
.tbox p,.tbox ul{margin:0}
.t-pps{--c:var(--pps);--bg:var(--pps-bg)} .t-pi{--c:var(--pi);--bg:var(--pi-bg)} .t-ppc{--c:var(--ppc);--bg:var(--ppc-bg)}
.t-agu{--c:var(--agu);--bg:#fbe3e0} .t-gra{--c:var(--gra);--bg:#e4f2dc} .t-esd{--c:var(--esd);--bg:#efe3f8}
.tboxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.tboxes{grid-template-columns:1fr}}
.vb{font-weight:700;border-radius:4px;padding:0 3px}
.vb.pps{color:var(--pps)} .vb.pi{color:var(--pi)} .vb.ppc{color:var(--ppc)} .vb.hl{background:var(--sel);color:var(--ink)}
.tablewrap{overflow-x:auto}
table.conj{border-collapse:collapse;font-size:.95rem;min-width:420px}
table.conj td,table.conj th{border:1.5px solid var(--line);padding:6px 10px;text-align:left}
table.conj th{background:var(--papyrus-2)}
table.conj th.pps{color:var(--pps)} table.conj th.pi{color:var(--pi)} table.conj th.ppc{color:var(--ppc)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{background:var(--lapis);color:var(--papyrus);border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:1rem}
.btn:hover{background:#21489a}
.btn.gold{background:var(--gold);color:var(--lapis-2)}
.btn.ghost{background:var(--papyrus);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.texts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.texts{grid-template-columns:1fr}}

/* syllables display */
.sy{display:inline-flex;gap:3px;flex-wrap:wrap;font-size:1.15rem}
.sy span{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:1px 8px}
.sy span.ton{background:var(--sel);border-color:var(--gold-2);font-weight:700}

/* analysis (formato carpeta) */
.an{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px;font-size:1.12rem;line-height:1.3}
.seg{display:inline-flex;flex-direction:column;min-width:0;max-width:100%}
.wrow{display:flex;flex-wrap:wrap;gap:0 .3em;padding-top:1.05em}
.w{position:relative;white-space:nowrap}
.w.nuc{font-weight:700}
.mk{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-style:normal;font-weight:700;font-size:.85em;line-height:1.05}
.brk{position:relative;margin-top:3px;padding-top:.72em;text-align:center;font-weight:700;font-size:.9em;line-height:1}
.brk::before{content:"";position:absolute;top:0;left:1px;right:1px;height:.5em;border:2.5px solid currentColor;border-top:0;border-radius:0 0 6px 6px}
.seg-s .mk,.seg-s .brk{color:var(--suj)}
.seg-p .mk,.seg-p .brk{color:var(--pred)}
.seg-st{color:var(--suj)}
.seg-st .brk::before{border-style:dashed}
.t-s{color:var(--suj)} .t-p{color:var(--pred)}

/* question */
.qhead{display:flex;align-items:center;gap:12px;font-weight:700;font-size:.92rem;color:var(--papyrus)}
.qhead .count{margin-left:auto;color:#c9d4ec}
.qhead .score{color:var(--gold)}
.link{background:none;border:0;cursor:pointer;color:var(--gold);font-weight:700;padding:4px 0}
.link:hover{text-decoration:underline}
.bar{height:10px;border-radius:99px;margin:10px 0 18px;overflow:hidden;background:rgba(255,255,255,.15)}
.bar span{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.qcard{background:var(--papyrus);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 0 0 1px var(--line),0 10px 30px -18px #000}
.qtag{margin:0;color:var(--ink-2)}
.prompt{font-family:var(--f-body);font-weight:700;font-size:1.15rem;line-height:1.4;margin:0}
.sent{font-size:1.28rem;background:#fff;border-radius:10px;padding:12px 14px;border-bottom:2px solid var(--line);margin:0}
.bigword{font-family:var(--f-display);font-size:2.2rem;text-align:center;background:#fff;border-radius:12px;padding:10px;letter-spacing:.02em}
.passage{border:1.5px solid var(--line);border-radius:10px;background:#fff}
.passage summary{cursor:pointer;padding:10px 14px;font-weight:700}
.passage .ptext{padding:0 16px 14px;max-height:46vh;overflow:auto;font-size:1.02rem;line-height:1.65}
.passage .ptext p{margin:0 0 .7em}
.passage h4{font-family:var(--f-display);font-weight:400;font-size:1.25rem;margin:4px 0 8px}
.passage h5{font-size:1rem;margin:10px 0 2px}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.options.stack{grid-template-columns:1fr}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:1.02rem;display:flex;flex-direction:column;gap:2px}
.opt:hover:not(:disabled){border-color:var(--lapis)}
.opt b{font-family:var(--f-display);font-weight:400;font-size:1.25rem;line-height:1.05}
.opt small{color:var(--ink-2);font-size:.86rem}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.opt.o-pps b{color:var(--pps)} .opt.o-pi b{color:var(--pi)} .opt.o-ppc b{color:var(--ppc)}
.opt.o-agu b{color:var(--agu)} .opt.o-gra b{color:var(--gra)} .opt.o-esd b{color:var(--esd)}
.toks{display:flex;flex-wrap:wrap;gap:8px}
.tok{background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 11px;font-size:1.15rem;cursor:pointer;line-height:1.3}
.tok:hover:not(:disabled){border-color:var(--lapis)}
.tok.in-s{background:var(--suj-bg);border-color:#86cfc5}
.tok.in-p{background:var(--pred-bg);border-color:#efa898}
.tok.sel{background:var(--sel);border-color:var(--ink)}
.tok.right{background:var(--ok-bg);border-color:var(--ok)}
.tok.wrong{background:var(--bad-bg);border-color:var(--bad);text-decoration:line-through}
.tok.missed{border-color:var(--ok);border-style:dashed}
.tok:disabled{cursor:default}
.tok-st{font-size:.95rem;font-weight:700;border-style:dashed}
/* syllable splitter */
.split{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;background:#fff;border-radius:12px;padding:14px 8px;font-family:var(--f-display);font-size:2.3rem;line-height:1}
.split .lt{padding:0 1px}
.gap{width:26px;height:46px;border:0;background:transparent;cursor:pointer;position:relative;padding:0;margin:0 -4px}
.gap::before{content:"";position:absolute;left:50%;top:8px;bottom:8px;width:2px;transform:translateX(-50%);background:var(--line);border-radius:2px}
.gap:hover::before{background:var(--lapis)}
.gap.on::before{width:6px;background:var(--gold-2);top:4px;bottom:4px}
.gap.right::before{background:var(--ok);width:6px}
.gap.wrong::before{background:var(--bad);width:6px}
.gap.missed::before{background:var(--ok);width:4px;opacity:.5}
.gap:disabled{cursor:default}
/* syllable picker / tilde */
.sylbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.sylb{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 16px;font-family:var(--f-display);font-size:1.8rem;cursor:pointer}
.sylb:hover:not(:disabled){border-color:var(--lapis)}
.sylb.right{background:var(--ok-bg);border-color:var(--ok)}
.sylb.wrong{background:var(--bad-bg);border-color:var(--bad)}
.sylb:disabled{cursor:default}
.letters{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:2px;background:#fff;border-radius:12px;padding:16px 8px;font-family:var(--f-display);font-size:2.3rem;line-height:1}
.letters .lt{padding:6px 2px}
.vow{border:0;background:var(--papyrus-2);border-radius:8px;padding:6px 6px;cursor:pointer;font:inherit;line-height:1;min-width:1.1em}
.vow:hover:not(:disabled){background:var(--sel)}
.vow.on{background:var(--sel);box-shadow:inset 0 0 0 2px var(--gold-2)}
.vow.right{background:var(--ok-bg);box-shadow:inset 0 0 0 2px var(--ok)}
.vow.wrong{background:var(--bad-bg);box-shadow:inset 0 0 0 2px var(--bad)}
.vow:disabled{cursor:default}
.notilde{align-self:center;background:#fff;border:2px dashed var(--line);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.notilde.on{background:var(--sel);border-style:solid;border-color:var(--ink)}
.notilde.right{background:var(--ok-bg);border-color:var(--ok);border-style:solid}
.notilde.wrong{background:var(--bad-bg);border-color:var(--bad);border-style:solid}
/* narration */
.narr{font-size:1.15rem;line-height:2;background:#fff;border-radius:12px;padding:12px 16px;margin:0}
.blank{display:inline-block;min-width:5.5em;text-align:center;border-bottom:2.5px solid var(--ink);padding:0 6px;font-weight:700;line-height:1.5}
.blank.empty{color:var(--ink-2);font-weight:400}
.blank.right{border-color:var(--ok);background:var(--ok-bg)}
.blank.wrong{border-color:var(--bad);background:var(--bad-bg)}
.nrows{display:flex;flex-direction:column;gap:8px}
.nrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.nrow .n{font-weight:700;width:2.4em;color:var(--ink-2)}
.nopt{background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:700}
.nopt:hover:not(:disabled){border-color:var(--lapis)}
.nopt.on{background:var(--sel);border-color:var(--ink)}
.nopt.right{background:var(--ok-bg);border-color:var(--ok)}
.nopt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.nopt:disabled{cursor:default}
/* sort */
.sorts{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px}
@media (max-width:600px){.srow{grid-template-columns:1fr}}
.srow .it{font-weight:700;font-size:1.08rem}
.srow.right{border-color:var(--ok);background:var(--ok-bg)}
.srow.wrong{border-color:var(--bad);background:var(--bad-bg)}
.srow .fix{display:block;font-weight:400;font-size:.88rem;color:var(--ok)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{background:var(--papyrus);border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.9rem;font-weight:700}
.cat.on{background:var(--lapis);color:var(--papyrus);border-color:var(--lapis)}
.cat:disabled{cursor:default}
/* order */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:10px;padding:8px 12px;min-height:46px;background:rgba(255,255,255,.5)}
.slot .n{font-weight:700;width:1.4em;color:var(--ink-2)}
.slot.filled{border-style:solid;border-color:var(--ink-2);background:#fff}
/* typed */
.typeform{display:flex;gap:10px;flex-wrap:wrap}
.answer{flex:1 1 200px;min-width:0;font:inherit;font-size:1.2rem;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.answer:focus{outline:none;border-color:var(--lapis)}
.answer.right{border-color:var(--ok);background:var(--ok-bg)}
.answer.wrong{border-color:var(--bad);background:var(--bad-bg)}
.accents{display:flex;gap:6px;flex-wrap:wrap}
.acc{background:#fff;border:1.5px solid var(--line);border-radius:8px;width:40px;height:40px;cursor:pointer;font-size:1.15rem;font-weight:700}
.acc:hover{border-color:var(--lapis)}
.reqtense{display:inline-block;border-radius:999px;padding:2px 10px;font-weight:700;color:#fff;background:var(--c)}
/* feedback/result */
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;border:2px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb .verdict{font-family:var(--f-display);font-size:1.35rem;margin:0}
.fb.ok .verdict{color:var(--ok)} .fb.bad .verdict{color:var(--bad)}
.fb p,.fb ol{margin:0}
.fb .an{background:#fff;border-radius:10px;padding:8px 12px 10px}
.fb .btn{align-self:flex-start}
.result{text-align:center;align-items:center;padding:26px 18px}
.result .big{font-family:var(--f-display);font-size:3.4rem;line-height:1}
.result .stars{font-size:2rem}
.result p{margin:0;color:var(--ink-2)}
.result .actions{justify-content:center}
.clock{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-size:1.4rem;color:var(--papyrus)}
.clock .time{font-variant-numeric:tabular-nums;border-radius:12px;padding:4px 12px;background:var(--gold);color:var(--lapis-2)}
.clock .time.low{background:var(--bad);color:#fff}
.flash-ok{animation:fok .45s}
.flash-bad{animation:fbad .45s}
@keyframes fok{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes fbad{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

var TOKRE=/^([¡¿«"(]*)(\*?)(.+?)(\*?)([.,;:!?»")]*)$/;
function parse(src,tac){
  var s={src:src,tac:tac||null,tokens:[],sIdx:[],nIdx:[],pIdx:[],nvIdx:[]};
  src.split('|').forEach(function(part,si){
    var role=part.charAt(0),text=part.slice(2).trim();
    text.split(/\s+/).forEach(function(tok){
      var m=tok.match(TOKRE);
      var t={pre:m[1],word:m[3],post:m[5],nuc:m[2]==='*',role:role,seg:si,i:s.tokens.length};
      s.tokens.push(t);
      if(role==='S'){s.sIdx.push(t.i);if(t.nuc)s.nIdx.push(t.i);}else{s.pIdx.push(t.i);if(t.nuc)s.nvIdx.push(t.i);}
    });
  });
  s.sType=s.sIdx.length===0?'ST':(s.nIdx.length>1?'SEC':'SES');
  s.pType=s.nvIdx.length>1?'PVC':'PVS';
  s.inv=s.sIdx.length>0&&s.sIdx[0]>s.pIdx[0];
  s.text=s.tokens.map(function(t){return t.pre+t.word+t.post;}).join(' ');
  return s;
}

function phrase(s,idx){return idx.map(function(i){var t=s.tokens[i];return t.pre+t.word+t.post;}).join(' ').replace(/[.!?]$/,'');}
function qq(w){return '«'+esc(w)+'»';}
function listW(a){a=a.map(qq);return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' y '+a[a.length-1];}
var NUMW=['cero','un','dos','tres','cuatro'];
function renderAn(s){
  var h='<div class="an">';
  if(s.sType==='ST')h+='<span class="seg seg-st"><span class="wrow"><span class="w">('+esc(PRON_SHORT[s.tac])+')</span></span><span class="brk">ST</span></span>';
  var groups=[];
  s.tokens.forEach(function(t){var g=groups[groups.length-1];if(!g||g.seg!==t.seg){g={seg:t.seg,role:t.role,toks:[]};groups.push(g);}g.toks.push(t);});
  groups.forEach(function(g){var isS=g.role==='S';
    h+='<span class="seg '+(isS?'seg-s':'seg-p')+'"><span class="wrow">'+g.toks.map(function(t){
      return '<span class="w'+(t.nuc?' nuc':'')+'">'+(t.nuc?'<i class="mk">'+(isS?'n':'nv')+'</i>':'')+esc(t.pre+t.word+t.post)+'</span>';}).join('')+'</span><span class="brk">'+(isS?s.sType:s.pType)+'</span></span>';});
  return h+'</div>';
}
function an(src,tac){return renderAn(parse(src,tac));}
function explainS(s){
  if(s.sType==='ST')return 'El sujeto no está escrito, pero el verbo '+listW(words(s,s.nvIdx.slice(0,1)))+' nos dice quién hace la acción: <b>'+PRON[s.tac]+'</b>. Es un <b>sujeto tácito (ST)</b>.';
  var n=s.nIdx.length;
  if(n===1)return 'El sujeto es '+qq(phrase(s,s.sIdx))+'. Tiene un solo núcleo, '+qq(words(s,s.nIdx)[0])+': es un <b>sujeto expreso simple (SES)</b>.';
  return 'El sujeto es '+qq(phrase(s,s.sIdx))+'. Tiene '+NUMW[n]+' núcleos, '+listW(words(s,s.nIdx))+', unidos por una conjunción: es un <b>sujeto expreso compuesto (SEC)</b>.';
}
function explainP(s){
  var n=s.nvIdx.length;
  if(n===1)return 'El predicado tiene un solo núcleo verbal, '+qq(words(s,s.nvIdx)[0])+': es un <b>predicado verbal simple (PVS)</b>.';
  return 'El predicado tiene '+NUMW[n]+' núcleos verbales, '+listW(words(s,s.nvIdx))+': es un <b>predicado verbal compuesto (PVC)</b>.';
}
var OPT_S=[{v:'ST',l:'Sujeto tácito'},{v:'SES',l:'Sujeto expreso simple'},{v:'SEC',l:'Sujeto expreso compuesto'}];
var OPT_P=[{v:'PVS',l:'Predicado verbal simple'},{v:'PVC',l:'Predicado verbal compuesto'}];
function sentBox(s){return '<p class="sent">'+esc(s.text)+'</p>';}
function qPickS(s,x){return Object.assign({type:'pick',mode:'S',s:s,tag:'Buscá el sujeto',prompt:'Tocá todas las palabras del <b class="t-s">sujeto</b>. Si no está escrito, tocá «Sujeto tácito».',explain:explainS(s)},x||{});}
function qPickN(s,x){return Object.assign({type:'pick',mode:'n',s:s,tag:'Núcleo del sujeto',prompt:'El <b class="t-s">sujeto</b> está pintado. Tocá su <b>núcleo</b>. Si tiene más de uno, tocalos todos.',explain:explainS(s)},x||{});}
function qPickNv(s,x){return Object.assign({type:'pick',mode:'nv',s:s,tag:'Núcleo del predicado',prompt:'El <b class="t-p">predicado</b> está pintado. Tocá el o los <b>núcleos verbales</b>.',explain:explainP(s)},x||{});}
function qClassS(s,x){return Object.assign({type:'mc',s:s,tag:'Tipo de sujeto',visual:sentBox(s),prompt:'¿Qué tipo de sujeto tiene esta oración?',
  options:OPT_S.map(function(o){return {v:o.v,html:'<b>'+o.v+'</b><small>'+o.l+'</small>'};}),answer:s.sType,explain:explainS(s)},x||{});}
function qTac(s,x){return Object.assign({type:'mc',s:s,tag:'Sujeto tácito',visual:sentBox(s),prompt:'El sujeto no está escrito. Mirá el verbo: ¿quién hace la acción?',
  options:PRON_ORDER.map(function(k){return {v:k,html:esc(PRON[k])};}),answer:s.tac,explain:explainS(s)},x||{});}
function qClassP(s,x){return Object.assign({type:'mc',s:s,tag:'Tipo de predicado',visual:sentBox(s),prompt:'¿Qué tipo de predicado tiene esta oración?',
  options:OPT_P.map(function(o){return {v:o.v,html:'<b>'+o.v+'</b><small>'+o.l+'</small>'};}),answer:s.pType,explain:explainP(s)},x||{});}

function passageHTML(T){
  var inner='<h4>'+esc(T.title)+'</h4>';
  if(T.body)inner+=T.body.map(function(p){return '<p>'+p+'</p>';}).join('');
  else inner+=T.sections.map(function(s){return (s[0]?'<h5>'+esc(s[0])+'</h5>':'')+'<p>'+s[1]+'</p>';}).join('');
  return '<details class="passage" open><summary>Texto: '+esc(T.title)+'</summary><div class="ptext">'+inner+'</div></details>';
}
function textQs(T){
  return T.qs.map(function(d){
    var q;
    if(d.t==='mc')q={type:'mc',prompt:esc(d.p),options:shuffle([d.a].concat(d.o)).map(function(o){return {v:o,html:esc(o)};}),answer:d.a,explain:d.e,optClass:'stack'};
    else if(d.t==='order')q={type:'order',prompt:esc(d.p),items:d.items,explain:d.e};
    else if(d.t==='tense'){var m=d.s.match(/\[([^\]]+)\]/);q={type:'mc',prompt:'En el texto dice: «'+esc(d.s).replace(/\[([^\]]+)\]/,'<span class="vb hl">$1</span>')+'». ¿En qué tiempo está «'+esc(m[1])+'»?',options:tenseOpts(),answer:d.a,explain:tenseExplain(d.a,d.e)};}
    else if(d.t==='word'){var w=mkWord(d.w);q=qWType(w);q.visual='';q.prompt='La palabra «'+esc(w.word)+'» aparece en el texto. ¿Qué tipo de palabra es?';}
    else{var s=parse(d.src,d.tac);
      if(d.t==='classS')q=qClassS(s);else if(d.t==='classP')q=qClassP(s);else if(d.t==='pickN')q=qPickN(s);else if(d.t==='pickS')q=qPickS(s);
      q.prompt=d.p;}
    q.passage=T.id;q.tag=T.kind+' · '+T.title;q.sec='lec';
    return q;
  });
}

var LESSON_TIEMPOS=function(extra){return '<h3>Los tiempos verbales en la narración</h3><p>En una narración usamos distintos tiempos del pasado. Cada uno tiene una función especial y juntos hacen posible contar la historia.</p>'+
 '<div class="tboxes"><div class="tbox t-pps"><h4>Pretérito perfecto simple</h4><p>Es el que más se usa. Cuenta las <b>acciones principales</b> y hace <b>avanzar la historia</b>.</p><ul><li>Hechos que pasaron y ya terminaron.</li><li>Acciones una después de otra.</li><li>Los momentos más importantes.</li></ul><p><i>Ayer <span class="vb pps">fuimos</span> al cine. Luego <span class="vb pps">compramos</span> pochoclos.</i></p></div>'+
 '<div class="tbox t-pi"><h4>Pretérito imperfecto</h4><p>Sirve para <b>describir</b> y contar situaciones que <b>duraban</b>.</p><ul><li>Describir lugares, personas o situaciones.</li><li>Acciones que duraban o se repetían.</li><li>Acciones al mismo tiempo que otras.</li></ul><p><i>La esfinge <span class="vb pi">tenía</span> cuerpo de león. Cada mañana <span class="vb pi">iban</span> a la escuela.</i></p></div>'+
 '<div class="tbox t-ppc"><h4>Pretérito pluscuamperfecto</h4><p>Cuenta acciones que pasaron <b>antes que otra acción del pasado</b>. Se forma con <b>había + verbo terminado en -ado / -ido</b>.</p><ul><li>Lo que ya había ocurrido antes.</li><li>Información que explica la historia.</li><li>La causa de algo que pasó después.</li></ul><p><i>Antes de viajar, <span class="vb ppc">había preparado</span> la valija.</i></p></div></div>'+
 '<h3>Cómo se ven los verbos</h3><div class="tablewrap"><table class="conj"><tr><th>Verbo</th><th class="pps">Perfecto simple</th><th class="pi">Imperfecto</th><th class="ppc">Pluscuamperfecto</th></tr>'+
 '<tr><td>cantar (yo)</td><td>canté</td><td>cantaba</td><td>había cantado</td></tr>'+
 '<tr><td>comer (él)</td><td>comió</td><td>comía</td><td>había comido</td></tr>'+
 '<tr><td>vivir (ellos)</td><td>vivieron</td><td>vivían</td><td>habían vivido</td></tr>'+
 '<tr><td>ir (nosotros)</td><td>fuimos</td><td>íbamos</td><td>habíamos ido</td></tr></table></div>'+
 '<div class="tip"><b>Pistas en la oración:</b><br><span class="vb pps">un día, de repente, ayer, luego, finalmente</span> → perfecto simple<br><span class="vb pi">siempre, todos los días, cada mañana, mientras</span> → imperfecto<br><span class="vb ppc">ya… cuando, antes de que</span> → pluscuamperfecto</div>'+(extra||'');};
var LESSON_ACENTO=function(extra){return '<h3>La sílaba tónica</h3><p>En toda palabra hay una sílaba que se pronuncia con más fuerza: es la <b>sílaba tónica</b>. La <b>tilde</b> marca la sílaba tónica, pero solo en algunas palabras. Para saber cuáles, hay tres reglas.</p>'+
 '<div class="tboxes"><div class="tbox t-agu"><h4>Agudas</h4><p>Tónica en la <b>última</b> sílaba.</p><p>Llevan tilde cuando terminan en <b>n, s o vocal</b>.</p><p><i>can-<b>ción</b>, ca-<b>fé</b> · pa-<b>pel</b> (sin tilde)</i></p></div>'+
 '<div class="tbox t-gra"><h4>Graves</h4><p>Tónica en la <b>penúltima</b> sílaba.</p><p>Llevan tilde cuando <b>no</b> terminan en n, s o vocal.</p><p><i><b>ár</b>-bol, <b>már</b>-mol · <b>tem</b>-plo (sin tilde)</i></p></div>'+
 '<div class="tbox t-esd"><h4>Esdrújulas</h4><p>Tónica en la <b>antepenúltima</b> sílaba.</p><p>Llevan tilde <b>¡siempre!</b></p><p><i><b>rá</b>-pi-do, <b>brú</b>-ju-la</i></p></div></div>'+(extra||'');};
var SYL_TIPS='<h3>Cómo separar en sílabas</h3><ul><li>Cada sílaba tiene por lo menos una vocal.</li><li>Una consonante entre dos vocales va con la segunda: <b>pa-pel</b>, <b>Ni-lo</b>.</li><li>Dos consonantes juntas se separan: <b>tum-ba</b>, <b>ár-bol</b>… salvo <b>pl, pr, bl, br, cl, cr, dr, tr, fl, fr, gl, gr</b>, que van juntas: <b>tem-plo</b>, <b>co-co-dri-lo</b>.</li><li><b>ch, ll, rr</b> nunca se separan: <b>ca-me-llo</b>.</li><li>Dos vocales que se pronuncian en un solo golpe van juntas: <b>cie-lo</b>, <b>pa-la-cio</b>, <b>ciu-dad</b>.</li><li>Dos vocales fuertes (a, e, o) juntas se separan: <b>fa-ra-ón</b>.</li></ul>';
var LESSON_SUJ=function(extra){return '<h3>Sujeto y predicado</h3><p>Toda oración se divide en dos partes: el <b class="t-s">sujeto</b> (de quién o de qué hablamos) y el <b class="t-p">predicado</b> (lo que se dice del sujeto: qué hace, qué es o qué le sucede).</p>'+
 '<div class="ex">'+an('S:Los antiguos *egipcios*|P:*construyeron* grandes templos.')+'</div>'+
 '<h3>Los núcleos</h3><ul><li><b class="t-s">Núcleo del sujeto (n)</b>: la palabra más importante del sujeto. Generalmente es un <b>sustantivo</b> o un <b>pronombre</b>. Se pregunta: ¿quién es? ¿de qué se habla?</li><li><b class="t-p">Núcleo del predicado (nv)</b>: la palabra más importante del predicado. Generalmente es un <b>verbo</b>. Se pregunta: ¿qué hace? ¿qué es? ¿qué le sucede?</li></ul>'+
 '<h3>Tipos de sujeto</h3><ul><li><b>Sujeto expreso</b>: aparece escrito. Puede ser <b>simple (SES)</b>, con un solo núcleo, o <b>compuesto (SEC)</b>, con dos o más núcleos unidos por <b>y, e, o, u</b>.</li><li><b>Sujeto tácito (ST)</b>: no aparece escrito, pero lo descubrimos por el contexto o por la terminación del verbo.</li></ul>'+
 '<div class="ex">'+an('S:Los *escribas* y los *sacerdotes*|P:*escribían* en papiros.')+'</div><div class="ex">'+an('P:*Escribían* en las paredes del templo.','ellos')+'</div>'+
 '<h3>Tipos de predicado</h3><ul><li><b>Predicado verbal simple (PVS)</b>: un solo núcleo verbal.</li><li><b>Predicado verbal compuesto (PVC)</b>: dos o más núcleos verbales.</li></ul>'+
 '<div class="ex">'+an('S:Los *artistas*|P:*pintaban* los símbolos y *decoraban* los templos.')+'</div>'+
 '<div class="tip"><b>Para recordar:</b> 1. Buscá el sujeto (¿de quién o de qué hablamos?). 2. Buscá el predicado (¿qué se dice del sujeto?). 3. Descubrí el núcleo del sujeto y el núcleo del predicado.</div>'+(extra||'');};

  make:function(){var st=byType(function(s){return s.sType==='ST';}),inv=byType(function(s){return s.inv;}),rest=byType(function(s){return s.sType!=='ST'&&!s.inv;});return shuffle(pick(st,2).concat(pick(inv,3),pick(rest,5))).map(function(s){return qPickS(s);});}},

function examQs(){

  var tie=pick(VB,2).map(qTenseReco).concat([qTenseChoose(rnd(VB)),qNarr(rnd(NARRS)),qTenseType(rnd(VB))]);
  var w=balancedWords(5);var ace=[qSyl(w[0]),qTilde(w[1]),qTilde(w[2]),qWType(w[3]),qTonic(w[4])];
  var withS=byType(function(s){return s.sType!=='ST';});

  tie.forEach(function(q){q.sec='tie';});ace.forEach(function(q){q.sec='ace';});suj.forEach(function(q){q.sec='suj';});

function renderQ(){

  }else if(q.type==='pick'){
    var s=q.s;
    body='<div class="toks" role="group" aria-label="Palabras de la oración">'+s.tokens.map(function(t){var cls='tok';if(q.mode==='n'&&t.role==='S')cls+=' in-s';if(q.mode==='nv'&&t.role==='P')cls+=' in-p';
      return '<button class="'+cls+'" data-tok="'+t.i+'" aria-pressed="false">'+esc(t.pre+t.word+t.post)+'</button>';}).join('')+'</div>'+
      (q.mode==='S'?'<div class="toks"><button class="tok tok-st" data-tok="st" aria-pressed="false">Sujeto tácito (no está escrito)</button></div>':'')+
      '<div><button class="btn" data-act="check">Comprobar</button></div>';
  }else if(q.type==='order'){
    S.pool=shuffle(q.items.map(function(x,i){return i;}));
    body='<div class="slots" id="slots"></div><div class="options stack" id="pool"></div><div class="actions" style="margin-top:0"><button class="btn" data-act="check" id="chk" disabled>Comprobar</button><button class="btn ghost" data-act="oreset">Empezar de nuevo</button></div>';
  }else if(q.type==='syl'){
    var L=Array.from(q.w.word);
    body='<div class="split" aria-label="Palabra para separar">'+L.map(function(c,i){return '<span class="lt">'+esc(c)+'</span>'+(i<L.length-1?'<button class="gap" data-gap="'+(i+1)+'" aria-label="Separar después de la letra '+(i+1)+'"></button>':'');}).join('')+'</div>'+
      '<p class="prompt" style="font-weight:400;font-size:1rem;margin:0">Así va quedando: <b id="sylprev">'+esc(q.w.word)+'</b></p><div><button class="btn" data-act="check">Comprobar</button></div>';
  }else if(q.type==='tonic'){
    body='<div class="sylbtns">'+q.w.syl.map(function(sy,i){return '<button class="sylb" data-sy="'+i+'">'+esc(sy)+'</button>';}).join('')+'</div>';
  }else if(q.type==='tilde'){
    var P=Array.from(q.w.plain);
    body='<div class="letters">'+P.map(function(c,i){return /[aeiouAEIOU]/.test(c)?'<button class="vow" data-v="'+i+'" aria-label="Poner tilde en '+esc(c)+'">'+esc(c)+'</button>':'<span class="lt">'+esc(c)+'</span>';}).join('')+'</div>'+
      '<button class="notilde" data-v="-1">No lleva tilde</button><div><button class="btn" data-act="check" id="chk" disabled>Comprobar</button></div>';
  }else if(q.type==='narr'){
    var html=esc(q.text).replace(/\u0001(\d+)\u0002/g,function(m,i){return '<span class="blank empty" data-bl="'+i+'">'+(+i+1)+'</span>';});
    body='<p class="narr"><b>'+esc(q.title)+'.</b> '+html+'</p><div class="nrows">'+q.blanks.map(function(b,i){return '<div class="nrow"><span class="n">'+(i+1)+'.</span>'+b.opts.map(function(o,j){return '<button class="nopt" data-nb="'+i+'" data-no="'+j+'">'+esc(o)+'</button>';}).join('')+'</div>';}).join('')+'</div>'+
      '<div><button class="btn" data-act="check" id="chk" disabled>Comprobar</button></div>';
  }else if(q.type==='sort'){
    body='<div class="sorts">'+q.items.map(function(it,i){return '<div class="srow" data-srow="'+i+'"><span class="it">'+esc(it[0])+'</span><span class="cats">'+q.cats.map(function(c,ci){return '<button class="cat" data-si="'+i+'" data-sc="'+ci+'">'+esc(c)+'</button>';}).join('')+'</span></div>';}).join('')+'</div><div><button class="btn" data-act="check" id="chk" disabled>Comprobar</button></div>';
  }else if(q.type==='type'){
    body='<form class="typeform" autocomplete="off"><input class="answer" id="ans" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Tu respuesta" placeholder="Escribí el verbo"><button class="btn" type="submit">Comprobar</button></form>'+
      '<div class="accents" aria-label="Letras con tilde">'+['á','é','í','ó','ú'].map(function(c){return '<button class="acc" type="button" data-acc="'+c+'">'+c+'</button>';}).join('')+'</div>';
  }
  var passage=q.passage?passageHTML(textById(q.passage)):'';
  app.innerHTML=topbar()+
   '<div class="qhead"><button class="link" data-act="home">← Temas</button><span class="count">'+(S.i+1)+' / '+S.qs.length+'</span><span class="score" aria-label="Respuestas correctas">✔ '+S.score+'</span></div>'+
   '<div class="bar"><span style="width:'+(S.i/S.qs.length*100)+'%"></span></div>'+
   '<section class="qcard"><p class="qtag label">'+esc(q.tag||S.title)+'</p>'+passage+(q.visual||'')+'<h2 class="prompt">'+q.prompt+'</h2>'+body+'<div id="fb" aria-live="polite"></div></section>';
  if(q.type==='order')drawOrder();
  var a=document.getElementById('ans');if(a)a.focus({preventScroll:true});
}
function enableCheck(on){var b=document.getElementById('chk');if(b)b.disabled=!on||S.answered;}
function drawOrder(){var q=S.qs[S.i];
  document.getElementById('slots').innerHTML=q.items.map(function(x,i){var v=S.order[i];return '<div class="slot'+(v!==undefined?' filled':'')+'"><span class="n">'+(i+1)+'</span><span>'+(v!==undefined?esc(q.items[v]):'')+'</span></div>';}).join('');
  document.getElementById('pool').innerHTML=S.pool.filter(function(i){return S.order.indexOf(i)<0;}).map(function(i){return '<button class="opt" data-oi="'+i+'">'+esc(q.items[i])+'</button>';}).join('');
  enableCheck(S.order.length===q.items.length);}
function sylBreaks(w){var b=[],n=0;w.syl.slice(0,-1).forEach(function(s){n+=Array.from(s).length;b.push(n);});return b;}
function drawSyl(){var q=S.qs[S.i],L=Array.from(q.w.word),out='';L.forEach(function(c,i){out+=c;if(S.gaps[i+1])out+='-';});document.getElementById('sylprev').textContent=out;
  all('.gap').forEach(function(g){g.classList.toggle('on',!!S.gaps[+g.dataset.gap]);});}
function drawTilde(){all('[data-v]').forEach(function(el){el.classList.toggle('on',S.tv!==null&&+el.dataset.v===S.tv);});enableCheck(S.tv!==null);}
function drawNarr(){var q=S.qs[S.i];
  all('.nopt').forEach(function(el){el.classList.toggle('on',S.nsel[+el.dataset.nb]===+el.dataset.no);});
  all('.blank[data-bl]').forEach(function(el){var i=+el.dataset.bl,v=S.nsel[i];el.textContent=v===undefined?(i+1):q.blanks[i].opts[v];el.classList.toggle('empty',v===undefined);});
  enableCheck(Object.keys(S.nsel).length===q.blanks.length);}
function drawSort(){var q=S.qs[S.i];all('.cat').forEach(function(el){el.classList.toggle('on',S.srt[+el.dataset.si]===+el.dataset.sc);});enableCheck(Object.keys(S.srt).length===q.items.length);}
function sameSet(a,b){if(a.length!==b.length)return false;var m={};a.forEach(function(x){m[x]=1;});return b.every(function(x){return m[x];});}
function norm(s){return s.trim().toLowerCase().replace(/\s+/g,' ').replace(/[.!¡]$/,'');}

var PRAISE=['¡Muy bien!','¡Excelente!','¡Genial!','¡Perfecto!','¡Bravo!','¡Digno de un escriba!'];
var OOPS=['Casi…','¡Ups! Revisemos','No es esa','Mirá bien'];
function check(choice){
  if(S.answered)return;
  var q=S.qs[S.i],ok=false,extra='',showAn=false;
  if(q.type==='mc'){
    var o=q.options[choice];ok=o.v===q.answer;
    all('.opt').forEach(function(el,k){el.disabled=true;if(q.options[k].v===q.answer)el.classList.add('right');else if(k===choice)el.classList.add('wrong');});
    showAn=!!q.s;
  }else if(q.type==='pick'){
    var s=q.s,target=q.mode==='S'?s.sIdx:q.mode==='n'?s.nIdx:s.nvIdx;
    var sel=Object.keys(S.sel).filter(function(k){return S.sel[k]&&k!=='st';}).map(Number);
    if(q.mode==='S'&&s.sType==='ST')ok=!!S.sel.st&&sel.length===0;else ok=!S.sel.st&&sameSet(sel,target);
    all('.tok').forEach(function(el){el.disabled=true;var k=el.dataset.tok;
      if(k==='st'){if(s.sType==='ST')el.classList.add(S.sel.st?'right':'missed');else if(S.sel.st)el.classList.add('wrong');return;}
      var i=+k,inT=target.indexOf(i)>=0,isSel=!!S.sel[i];el.classList.remove('sel');
      if(isSel&&inT)el.classList.add('right');else if(isSel&&!inT)el.classList.add('wrong');else if(!isSel&&inT)el.classList.add('missed');});
    showAn=true;
  }else if(q.type==='order'){
    ok=S.order.every(function(v,i){return v===i;});all('#pool .opt').forEach(function(el){el.disabled=true;});
    if(!ok)extra='<p><b>El orden correcto es:</b></p><ol style="padding-left:1.4em">'+q.items.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  }else if(q.type==='syl'){
    var br=sylBreaks(q.w),mine=Object.keys(S.gaps).filter(function(k){return S.gaps[k];}).map(Number);ok=sameSet(br,mine);
    all('.gap').forEach(function(g){g.disabled=true;var i=+g.dataset.gap,on=!!S.gaps[i],should=br.indexOf(i)>=0;g.classList.remove('on');
      if(on&&should)g.classList.add('right');else if(on&&!should)g.classList.add('wrong');else if(!on&&should)g.classList.add('missed');});
  }else if(q.type==='tonic'){
    ok=choice===q.w.tonic;all('.sylb').forEach(function(el){el.disabled=true;var i=+el.dataset.sy;if(i===q.w.tonic)el.classList.add('right');else if(i===choice)el.classList.add('wrong');});
  }else if(q.type==='tilde'){
    var P=Array.from(q.w.word),pos=-1;P.forEach(function(c,i){if(hasAcc(c))pos=i;});ok=S.tv===pos;
    all('[data-v]').forEach(function(el){el.disabled=true;var v=+el.dataset.v;el.classList.remove('on');if(v===pos){el.classList.add('right');if(v>=0)el.textContent=P[v];}else if(v===S.tv)el.classList.add('wrong');});
    extra='';
  }else if(q.type==='narr'){
    ok=true;var lines=[];
    q.blanks.forEach(function(b,i){var g=b.opts[S.nsel[i]]===b.ans;if(!g)ok=false;var bl=document.querySelector('.blank[data-bl="'+i+'"]');bl.classList.add(g?'right':'wrong');
      all('.nopt[data-nb="'+i+'"]').forEach(function(el){el.disabled=true;var oo=b.opts[+el.dataset.no];el.classList.remove('on');if(oo===b.ans)el.classList.add('right');else if(+el.dataset.no===S.nsel[i])el.classList.add('wrong');});
      lines.push('<li><b>'+esc(b.ans)+'</b>: '+esc(q.why[i])+'</li>');});
    extra='<ol style="padding-left:1.4em">'+lines.join('')+'</ol>';
  }else if(q.type==='sort'){
    ok=true;q.items.forEach(function(it,i){var g=S.srt[i]===it[1];if(!g)ok=false;var r=document.querySelector('.srow[data-srow="'+i+'"]');r.classList.add(g?'right':'wrong');
      if(!g)r.querySelector('.it').innerHTML=esc(it[0])+'<span class="fix">Va en: '+esc(q.cats[it[1]])+'</span>';});
    all('.cat').forEach(function(el){el.disabled=true;});
    if(q.wordsInfo&&!ok)extra='<p>'+q.wordsInfo.filter(function(w,i){return S.srt[i]!==q.items[i][1];}).map(function(w){return sylHTML(w)+' → '+w.type.n.toLowerCase();}).join('<br>')+'</p>';
  }else if(q.type==='type'){
    var inp=document.getElementById('ans'),got=norm(inp.value),want=norm(q.answer);ok=got===want;
    inp.disabled=true;inp.classList.add(ok?'right':'wrong');all('.typeform .btn,.acc').forEach(function(el){el.disabled=true;});
    if(!ok){if(strip(got)===strip(want)&&got.length)extra='<p><b>¡Casi!</b> Escribiste bien las letras, pero revisá la tilde: es <b>'+esc(q.answer)+'</b>.</p>';
      else extra='<p>La respuesta correcta es <b>'+esc(q.answer)+'</b>.</p>';}
  }
  S.answered=true;
  if(ok){S.score++;sOk();}else{S.wrong.push(q);sBad();}
  enableCheck(false);all('[data-act=check],[data-act=oreset]').forEach(function(el){el.disabled=true;});
  var fb=document.getElementById('fb');
  fb.innerHTML='<div class="fb '+(ok?'ok':'bad')+'"><p class="verdict">'+(ok?rnd(PRAISE):rnd(OOPS))+'</p>'+(ok?'':extra)+(q.explain?'<p>'+q.explain+'</p>':'')+(q.type==='narr'&&ok?extra:'')+
   (showAn&&q.s?renderAn(q.s):'')+'<button class="btn" data-act="next">'+(S.i+1<S.qs.length?'Siguiente →':'Ver resultado')+'</button></div>';
  var nb=fb.querySelector('[data-act=next]');nb.focus({preventScroll:true});fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function renderResult(){
  var total=S.qs.length,pct=S.score/total,n=starsFor(pct);
  if(S.topicId)saveBest(S.topicId,pct);if(n>=2)sWin();
  var msg=n===3?'¡Lo sabés muy bien! Estás listo para la evaluación.':n===2?'¡Muy bien! Repasá los errores y vas a llegar a las tres estrellas.':n===1?'Vas bien. Volvé a leer el repaso y probá otra vez.':'Leé el repaso con calma y volvé a intentarlo. ¡Practicando se aprende!';
  app.innerHTML=topbar()+'<section class="qcard result"><p class="qtag label">'+esc(S.title)+'</p><span class="big">'+S.score+' / '+total+'</span>'+starStr(pct)+'<p>'+msg+'</p>'+
   '<div class="actions">'+(S.wrong.length?'<button class="btn gold" data-act="review">Repasar mis errores ('+S.wrong.length+')</button>':'')+
   (S.topicId?'<button class="btn'+(S.wrong.length?' ghost':' gold')+'" data-act="start" data-id="'+S.topicId+'">Jugar otra vez</button>':'')+
   '<button class="btn ghost" data-act="home">Volver a los temas</button></div></section>';
  window.scrollTo(0,0);
}
/* ---------- Desafío del faraón ---------- */
function quickQ(){
  var r=Math.floor(Math.random()*4);
  if(r===0){var e=rnd(VB);return {html:'<p class="sent">'+vbSentence(e,e[1][e[2]])+'</p><h2 class="prompt">¿En qué tiempo está el verbo marcado?</h2>',opts:TENSES.map(function(T,i){return {v:i,l:T.n.replace('Pretérito ','')};}),a:e[2]};}
  if(r===1){var w=rnd(WORDS);return {html:'<div class="bigword">'+esc(w.word)+'</div><h2 class="prompt">¿Qué tipo de palabra es?</h2>',opts:TYPES.map(function(T,i){return {v:i,l:T.n};}),a:TYPES.indexOf(w.type)};}
  if(r===2){var s=rnd(SENTS);return {html:sentBox(s)+'<h2 class="prompt">¿Qué tipo de sujeto tiene?</h2>',opts:OPT_S.map(function(o){return {v:o.v,l:o.v};}),a:s.sType};}
  var w2=rnd(WORDS);return {html:'<div class="bigword">'+esc(w2.plain)+'</div><h2 class="prompt">Así está escrita sin tilde. ¿Debería llevar tilde?</h2>',opts:[{v:1,l:'Sí, lleva tilde'},{v:0,l:'No lleva tilde'}],a:w2.has?1:0,w:w2};
}
function startClock(){stopClock();S=null;C={left:60,score:0,tries:0,lock:false,timer:null};nextClock();
  C.timer=setInterval(function(){if(!C)return;C.left--;var el=document.getElementById('ctime');if(el){el.textContent=C.left+' s';el.classList.toggle('low',C.left<=10);}if(C.left<=0)endClock();},1000);}
function nextClock(){C.cur=quickQ();C.lock=false;
  app.innerHTML=topbar()+'<div class="clock"><button class="link" data-act="home">← Salir</button><span>✔ '+C.score+'</span><span class="time'+(C.left<=10?' low':'')+'" id="ctime">'+C.left+' s</span></div>'+
   '<section class="qcard" id="ccard" style="margin-top:14px"><p class="qtag label">Desafío del faraón</p>'+C.cur.html+'<div class="options">'+C.cur.opts.map(function(o){return '<button class="opt" data-cv="'+o.v+'">'+esc(o.l)+'</button>';}).join('')+'</div></section>';}
function answerClock(v){if(!C||C.lock)return;C.lock=true;C.tries++;
  var ok=String(v)===String(C.cur.a),card=document.getElementById('ccard');
  all('.opt').forEach(function(el){el.disabled=true;if(el.dataset.cv===String(C.cur.a))el.classList.add('right');else if(el.dataset.cv===String(v))el.classList.add('wrong');});
  if(ok){C.score++;sOk();card.classList.add('flash-ok');}else{sBad();card.classList.add('flash-bad');}
  setTimeout(function(){if(C&&C.left>0)nextClock();},ok?450:1200);}
function endClock(){var score=C.score,tries=C.tries;clearInterval(C.timer);C=null;var rec=saveBest('reloj',score);sWin();
  app.innerHTML=topbar()+'<section class="qcard result"><p class="qtag label">Desafío del faraón</p><span class="big">'+score+'</span><p>aciertos en un minuto ('+tries+' respondidas)</p><p><b>'+(rec&&score>0?'¡Nuevo récord!':'Tu récord: '+(loadBest().reloj||0))+'</b></p>'+
   '<div class="actions"><button class="btn gold" data-act="clock">Jugar otra vez</button><button class="btn ghost" data-act="home">Volver a los temas</button></div></section>';}

/* ---------- eventos ---------- */
app.addEventListener('submit',function(e){e.preventDefault();if(S&&!S.answered&&S.qs[S.i].type==='type'){var v=document.getElementById('ans').value;if(v.trim())check();}});
app.addEventListener('click',function(e){
  var el=e.target.closest('button');if(!el||el.disabled)return;
  var d=el.dataset,act=d.act;
  if(act==='home')return renderHome();
  if(act==='mute'){muted=!muted;sset('-mute',muted);el.textContent=muted?'🔇':'🔊';el.setAttribute('aria-label',muted?'Activar sonido':'Silenciar');return;}
  if(act==='lesson')return renderLesson(d.id);
  if(act==='start')return startRound(d.id);
  if(act==='clock')return startClock();
  if(act==='review')return startRound(null,shuffle(S.wrong));
  if(act==='next'){S.i++;if(S.i>=S.qs.length)return renderResult();renderQ();window.scrollTo({top:0});return;}
  if(act==='check')return check();
  if(act==='oreset'){S.order=[];drawOrder();return;}
  if(d.cv!==undefined)return answerClock(d.cv);
  if(!S||S.answered)return;
  if(d.k!==undefined)return check(+d.k);
  if(d.tok!==undefined){var k=d.tok;
    if(k==='st'){S.sel={};all('.tok').forEach(function(t){t.classList.remove('sel');t.setAttribute('aria-pressed','false');});}
    else if(S.sel.st){S.sel.st=false;var b=document.querySelector('.tok-st');b.classList.remove('sel');b.setAttribute('aria-pressed','false');}
    S.sel[k]=!S.sel[k];el.classList.toggle('sel',S.sel[k]);el.setAttribute('aria-pressed',S.sel[k]?'true':'false');return;}
  if(d.oi!==undefined){S.order.push(+d.oi);drawOrder();return;}
  if(d.gap!==undefined){var g=+d.gap;S.gaps[g]=!S.gaps[g];drawSyl();return;}
  if(d.sy!==undefined)return check(+d.sy);
  if(d.v!==undefined){var v=+d.v;S.tv=S.tv===v?null:v;drawTilde();return;}
  if(d.nb!==undefined){S.nsel[+d.nb]=+d.no;drawNarr();return;}
  if(d.si!==undefined){S.srt[+d.si]=+d.sc;drawSort();return;}
  if(d.acc!==undefined){var inp=document.getElementById('ans');if(inp){var st=inp.selectionStart||inp.value.length,en=inp.selectionEnd||st;inp.value=inp.value.slice(0,st)+d.acc+inp.value.slice(en);inp.focus();inp.setSelectionRange(st+1,st+1);}return;}
});
window.__F={cur:function(){return S&&S.qs[S.i];},st:function(){return S;},WORDS:WORDS,VB:VB,NARRS:NARRS,SENTS:SENTS,TEXTS:TEXTS,TOPICS:TOPICS,mkWord:mkWord,sylBreaks:sylBreaks,examQs:examQs,strip:strip};
renderHome();
})();
</script>
</body>
